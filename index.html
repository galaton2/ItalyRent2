<!DOCTYPE html>
<html lang="ru">
<head>
  
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Italy Housing</title>

<!-- Telegram Mini Apps SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase (compat build — без сборщика, всё через <script>) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Leaflet (карта, OpenStreetMap — бесплатно, без API-ключа) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Leaflet.markercluster — красивая кластеризация меток на карте -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
  /* ============ TOKENS ============ */
  :root{
    --bg-0:#141b24;
    --bg-1:#1c2531;
    --slate-700:#25313f;
    --slate-600:#2e3c4c;
    --slate-500:#3c4d60;
    --slate-400:#546274;
    --slate-border:#3a4757;
    --lime:#d8ff3e;
    --lime-dim:#c8ee2e;
    --lime-ink:#1c2606;
    --paper:#f4f6f4;
    --paper-dim:#e7ebe4;
    --ink:#101418;
    --ink-soft:#5c6672;
    --text-0:#f3f6fa;
    --text-1:#aab5c2;
    --text-2:#76839333;
    --coral:#ff7a66;
    --sky:#7fb7ff;
    --violet:#b79cff;
    --radius-xl:28px;
    --radius-l:22px;
    --radius-m:16px;
    --radius-s:12px;
    --font-display:"Sora","SF Pro Display",-apple-system,"Segoe UI",sans-serif;
    --font-body:"Inter","SF Pro Text",-apple-system,"Segoe UI",Roboto,sans-serif;
    --tabbar-h:76px;
  }

  @font-face{
    font-family:"Sora"; font-weight:600 800; font-display:swap;
    src:local("Sora"),local("SF Pro Display");
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 60% at 20% -10%, #223146 0%, transparent 55%),
      radial-gradient(90% 50% at 100% 0%, #202b3a 0%, transparent 60%),
      var(--bg-0);
    color:var(--text-0);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  ::-webkit-scrollbar{display:none;}
  img{-webkit-user-drag:none;}

  #app{max-width:520px; margin:0 auto; position:relative; min-height:100vh;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
    background:linear-gradient(180deg, var(--bg-0) 60%, transparent);
  }
  .avatar{
    width:42px; height:42px; border-radius:14px; flex:none;
    background:var(--slate-600); object-fit:cover;
    border:1px solid var(--slate-border);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:var(--lime);
  }
  .topbar-mid{flex:1; min-width:0;}
  .topbar-name{font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .icon-btn{
    width:42px; height:42px; border-radius:14px; flex:none;
    background:var(--slate-600); border:1px solid var(--slate-border);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .icon-btn svg{width:19px; height:19px;}
  .plus-btn{background:var(--lime); border-color:var(--lime); color:var(--lime-ink);}
  .dot-badge{
    position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%;
    background:var(--lime); box-shadow:0 0 0 2px var(--slate-600);
  }

  /* ---------- SCREENS ---------- */
  main{padding:0 20px calc(var(--tabbar-h) + 28px);}
  .screen{display:none; animation:fadeUp .32s ease both;}
  .screen.active{display:block;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .section-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:26px 2px 12px;
  }
  .section-title h2{font-size:17px;}
  .section-title .link{font-size:13px; color:var(--lime); font-weight:600;}

  /* ---------- STAT-GLANCE (открывает домашний экран сразу с "ближайшим городом", без большого круга-счётчика) ---------- */
  .stat-glance{
    margin-top:6px;
    background:linear-gradient(155deg, var(--slate-600), var(--slate-700));
    border:1px solid var(--slate-border);
    border-radius:var(--radius-xl); padding:20px;
    position:relative; overflow:hidden;
  }
  .stat-glance::after{
    content:""; position:absolute; inset:-40% -20% auto auto; width:220px; height:220px;
    background:radial-gradient(circle, rgba(216,255,62,.16), transparent 70%); pointer-events:none;
  }
  .stat-glance-top{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1;}
  .sg-label-row{display:flex; align-items:center; gap:8px;}
  .sg-label{font-size:11px; color:var(--text-1); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .sg-locate-btn{
    width:26px; height:26px; border-radius:9px; background:rgba(216,255,62,.14);
    border:1px solid rgba(216,255,62,.3); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .sg-locate-btn svg{width:13px; height:13px; color:var(--lime);}
  .sg-locate-btn.loading svg{animation:spin 1s linear infinite;}
  .sg-city{font-size:20px; font-weight:800; font-family:var(--font-display); margin-top:6px; cursor:pointer;}
  .sg-count-wrap{text-align:right;}
  .sg-count-wrap b{display:block; font-size:28px; font-family:var(--font-display); color:var(--lime); line-height:1;}
  .sg-count-wrap span{font-size:10.5px; color:var(--text-1); font-weight:600;}
  .stat-glance-bottom{
    display:flex; justify-content:space-between; align-items:center; margin-top:16px;
    padding-top:16px; border-top:1px solid rgba(255,255,255,.08); position:relative; z-index:1;
  }
  .sg-chip{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-1); cursor:pointer;}
  .sg-chip svg{width:14px; height:14px; color:var(--lime);}
  .sg-range{font-size:12.5px; font-weight:700; color:var(--text-0);}

  /* ---------- CATEGORY GRID ---------- */
  .category-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .category-card{
    background:var(--slate-700); border:1px solid var(--slate-border); border-radius:var(--radius-m);
    padding:14px; text-align:left; display:flex; flex-direction:column; gap:16px;
  }
  .category-card-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .category-icon{
    width:38px; height:38px; border-radius:12px; background:var(--slate-600);
    display:flex; align-items:center; justify-content:center; color:var(--lime);
  }
  .category-icon svg{width:18px; height:18px;}
  .category-count-badge{
    font-size:10px; font-weight:800; color:var(--lime-ink); background:var(--lime);
    padding:3px 8px; border-radius:10px;
  }
  .category-card b{font-size:13.5px; font-weight:800; line-height:1.25;}
  .category-card span{font-size:11px; color:var(--text-1); font-weight:600;}

  /* ---------- SEARCH BAR (превью на главной) ---------- */
  .searchbar{
    margin-top:16px; display:flex; align-items:center; gap:10px;
    background:var(--slate-700); border:1px solid var(--slate-border);
    border-radius:var(--radius-m); padding:13px 16px;
  }
  .searchbar svg{width:17px; height:17px; color:var(--text-1); flex:none;}
  .searchbar input{
    background:none; border:none; outline:none; color:var(--text-0);
    font-size:14.5px; width:100%; font-family:var(--font-body);
  }
  .searchbar input::placeholder{color:var(--text-1);}

  /* ---------- CHIP ROW (города) ---------- */
  .chip-row{display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:2px;}
  .chip{
    flex:none; padding:9px 15px; border-radius:20px; font-size:13px; font-weight:600;
    background:var(--slate-700); border:1px solid var(--slate-border); color:var(--text-1);
    white-space:nowrap; transition:.15s;
  }
  .chip.active{background:var(--lime); color:var(--lime-ink); border-color:var(--lime);}

  /* ---------- LISTING PHOTO (с плейсхолдером, если фото нет/битое, и мягким шиммером на время загрузки) ---------- */
  .listing-photo{position:relative; background:var(--slate-500); overflow:hidden;}
  .lp-placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.28); background:linear-gradient(155deg, var(--slate-600), var(--slate-500));}
  .lp-placeholder svg{width:26px; height:26px;}
  .lp-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .25s ease;}
  .lp-img.loaded{opacity:1;}

  /* ---------- LISTING CARDS ---------- */
  .listing-grid{display:flex; flex-direction:column; gap:12px;}
  .listing-card{
    display:flex; gap:0; background:var(--paper); border-radius:var(--radius-l);
    overflow:hidden; color:var(--ink); position:relative;
  }
  .listing-photo.card-photo{width:108px; flex:none; display:flex; align-items:flex-start; justify-content:flex-end; padding:8px;}
  .listing-photo .status{
    font-size:9.5px; font-weight:800; padding:4px 8px; border-radius:8px;
    background:rgba(20,27,36,.72); color:var(--lime); letter-spacing:.02em; position:relative; z-index:2;
  }
  .listing-body{flex:1; padding:12px 14px; min-width:0;}
  .listing-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .listing-title{font-size:14.5px; font-weight:800; line-height:1.25;}
  .listing-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px; display:flex; align-items:center; gap:4px;}
  .price-pill{
    flex:none; background:var(--ink); color:var(--lime); font-size:11.5px; font-weight:800;
    padding:6px 10px; border-radius:12px; white-space:nowrap;
  }
  .listing-tags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .tag{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--paper-dim);
    padding:4px 9px; border-radius:9px;
  }

  .listing-grid.skeleton .listing-card{background:var(--slate-700);}
  .shimmer{
    background:linear-gradient(90deg, var(--slate-600) 25%, var(--slate-500) 37%, var(--slate-600) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite;
    border-radius:10px;
  }
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  .empty{text-align:center; padding:52px 20px; color:var(--text-1);}
  .empty .glyph{
    width:64px; height:64px; margin:0 auto 16px; border-radius:20px;
    background:var(--slate-700); border:1px solid var(--slate-border);
    display:flex; align-items:center; justify-content:center;
  }
  .empty .glyph svg{width:26px; height:26px; color:var(--lime);}
  .empty h3{color:var(--text-0); font-size:15px; margin-bottom:6px;}
  .empty p{font-size:12.5px; line-height:1.5;}
  .empty.on-map{color:var(--text-1);}
  .empty.on-map .glyph{background:var(--slate-600);}

  /* ---------- SEARCH SCREEN: full-bleed super map ---------- */
  #screen-search{padding-top:4px;}
  .search-map-screen{
    position:relative; margin:0 -20px; width:calc(100% + 40px);
    height:calc(100svh - 126px); min-height:500px;
    background:var(--slate-700); overflow:hidden;
  }
  .search-map-screen .leaflet-container{background:var(--bg-0); font-family:var(--font-body); height:100%;}
  .map-controls{position:absolute; top:16px; right:16px; z-index:1000; display:flex; flex-direction:column; gap:8px;}
  .map-control-btn{
    width:42px; height:42px; border-radius:14px; background:rgba(20,27,36,.9); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12); color:var(--text-0); display:grid; place-items:center;
    box-shadow:0 8px 22px -12px rgba(0,0,0,.9); transition:transform .16s, background .16s;
  }
  .map-control-btn:active{transform:scale(.94);}
  .map-control-btn.active{background:var(--lime); color:var(--lime-ink); border-color:var(--lime);}
  .map-control-btn svg{width:19px; height:19px;}
  .map-settings{
    position:absolute; top:16px; right:66px; z-index:1000; width:226px; padding:14px;
    background:rgba(20,27,36,.94); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.12);
    border-radius:18px; box-shadow:0 16px 34px -14px rgba(0,0,0,.8); opacity:0; pointer-events:none;
    transform:translateX(8px) scale(.96); transform-origin:top right; transition:.2s ease;
  }
  .map-settings.open{opacity:1; pointer-events:auto; transform:none;}
  .map-settings-head{font-size:12px; font-weight:800; color:var(--text-0); margin-bottom:11px;}
  .map-style-switch{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:4px; border-radius:12px; background:var(--slate-700);}
  .map-style-btn{padding:8px 3px; border-radius:9px; color:var(--text-1); font-size:10px; font-weight:800;}
  .map-style-btn.active{background:var(--lime); color:var(--lime-ink);}
  .map-settings-action{width:100%; margin-top:10px; padding:10px; border-radius:11px; display:flex; align-items:center; gap:8px; color:var(--text-1); background:var(--slate-700); font-size:11px; font-weight:700; text-align:left;}
  .map-settings-action svg{width:15px; height:15px; color:var(--lime);}
  .filter-fab{
    position:absolute; left:16px; bottom:18px; z-index:1000; display:flex; align-items:center; gap:8px; background:var(--lime); color:var(--lime-ink);
    font-size:12.5px; font-weight:800; padding:11px 16px 11px 13px; border-radius:20px;
    box-shadow:0 10px 22px -8px rgba(216,255,62,.55);
  }
  .filter-fab svg{width:15px; height:15px;}
  .filter-fab .fab-badge{
    position:absolute; top:-5px; right:-5px; background:var(--ink); color:var(--lime);
    font-size:10px; font-weight:800; min-width:17px; height:17px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--bg-0);
  }
  .map-loading-veil{
    position:absolute; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;
    background:var(--slate-700); color:var(--text-1); font-size:12.5px; font-weight:600; gap:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- RESULTS DRAWER (не используется на полноэкранной карте) ---------- */
  .results-drawer{
    position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + var(--tabbar-h) + 22px);
    max-width:488px; margin:0 auto; z-index:900;
    background:var(--bg-1); border:1px solid var(--slate-border); border-radius:22px;
    box-shadow:0 -14px 34px -12px rgba(0,0,0,.55);
    overflow:hidden; display:flex; flex-direction:column;
    height:126px; transition:height .32s cubic-bezier(.22,.68,0,1);
  }
  .results-drawer.expanded{height:min(64vh, 520px);}
  .drawer-handle{padding:10px 16px 10px; cursor:pointer; flex:none;}
  .drawer-grip{width:36px; height:4px; border-radius:3px; background:var(--slate-500); margin:0 auto 10px;}
  .drawer-count-row{display:flex; justify-content:space-between; align-items:center;}
  .drawer-count-row b{font-size:13.5px; font-weight:800;}
  .drawer-count-row .chev{width:16px; height:16px; color:var(--text-1); transition:transform .3s;}
  .results-drawer.expanded .drawer-count-row .chev{transform:rotate(180deg);}
  .drawer-peek-scroll{display:flex; gap:10px; overflow-x:auto; padding:0 16px 16px;}
  .results-drawer.expanded .drawer-peek-scroll{display:none;}
  .drawer-full-list{display:none; flex:1; overflow-y:auto; padding:0 16px 16px; flex-direction:column; gap:10px;}
  .results-drawer.expanded .drawer-full-list{display:flex;}

  .mini-card{
    flex:none; width:150px; background:var(--paper); border-radius:16px; overflow:hidden; color:var(--ink); cursor:pointer;
  }
  .mini-card .listing-photo{height:92px;}
  .mini-card .mc-body{padding:9px 10px 11px;}
  .mini-card .mc-title{font-size:11.5px; font-weight:800; line-height:1.25;}
  .mini-card .mc-price{font-size:11.5px; font-weight:800; color:var(--ink-soft); margin-top:3px;}

  /* ---------- FILTER SHEET ---------- */
  .filter-sheet .sheet-scroll{padding:6px 20px 30px;}
  .filter-sheet-title{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-right:48px; margin:6px 0 18px;}
  .filter-sheet-title h2{font-size:18px;}
  .filter-reset{flex:none; font-size:12.5px; font-weight:700; color:var(--coral); padding:7px 0;}
  .filter-block{
    background:var(--slate-700); border:1px solid var(--slate-border);
    border-radius:var(--radius-l); padding:16px; margin-top:14px;
  }
  .filter-block:first-of-type{margin-top:0;}
  .filter-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .filter-row:last-child{margin-bottom:0;}
  .filter-label{font-size:12px; font-weight:700; color:var(--text-1); text-transform:uppercase; letter-spacing:.04em;}
  .segmented{display:flex; flex-wrap:wrap; background:var(--slate-600); border-radius:12px; padding:3px; gap:2px;}
  .segmented button{flex:1; min-width:31%; padding:8px 6px; border-radius:9px; font-size:12px; font-weight:700; color:var(--text-1);}
  .segmented button.active{background:var(--lime); color:var(--lime-ink);}
  .range-row{display:flex; align-items:center; gap:10px;}
  .range-input{
    width:76px; background:var(--slate-600); border:1px solid var(--slate-border); border-radius:10px;
    color:var(--text-0); font-size:13px; padding:9px 10px; text-align:center; outline:none;
  }
  select.range-input{appearance:none; -webkit-appearance:none; width:auto; flex:1;}
  .sort-scroll{display:flex; gap:8px; overflow-x:auto; margin-top:0; padding-bottom:2px;}
  .sort-chip{
    flex:none; display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:20px;
    font-size:12.5px; font-weight:700; background:var(--slate-600); border:1px solid var(--slate-border);
    color:var(--text-1); white-space:nowrap;
  }
  .sort-chip.active{background:var(--lime); color:var(--lime-ink); border-color:var(--lime);}
  .apply-btn{
    width:100%; margin-top:18px; padding:15px; border-radius:14px;
    background:var(--lime); color:var(--lime-ink); font-weight:800; font-size:14px;
  }

  /* ---------- PROFILE (только сохранённые и собственные объявления) ---------- */
  .profile-hero{display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:14px; position:relative;}
  .profile-hero-glow{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%); width:260px; height:180px;
    background:radial-gradient(ellipse at center, rgba(216,255,62,.14), transparent 70%); pointer-events:none; z-index:0;
  }
  .avatar-ring{
    width:100px; height:100px; border-radius:32px; padding:3px; position:relative; z-index:1;
    background:conic-gradient(from 200deg, var(--lime), #7fe6b8, var(--sky), var(--violet), var(--lime));
    box-shadow:0 14px 30px -10px rgba(216,255,62,.35);
  }
  .profile-avatar{
    width:100%; height:100%; border-radius:28px; object-fit:cover;
    background:var(--slate-600);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; color:var(--lime); font-family:var(--font-display);
  }
  .profile-hero h1{font-size:21px; margin-top:16px; position:relative; z-index:1;}
  .handle-chip{
    margin-top:9px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    color:var(--text-1); background:var(--slate-700); border:1px solid var(--slate-border);
    padding:7px 14px; border-radius:16px; position:relative; z-index:1;
  }
  .member-since{margin-top:8px; font-size:11.5px; color:var(--text-1); font-weight:600; position:relative; z-index:1;}
  .member-since b{color:var(--text-0);}

  .profile-stats-card{
    margin-top:24px; display:flex; align-items:stretch;
    background:linear-gradient(155deg, var(--slate-600), var(--slate-700));
    border:1px solid var(--slate-border); border-radius:var(--radius-l); padding:18px 6px;
    position:relative; overflow:hidden;
  }
  .profile-stats-card::after{
    content:""; position:absolute; inset:-50% -10% auto auto; width:180px; height:180px;
    background:radial-gradient(circle, rgba(216,255,62,.12), transparent 70%); pointer-events:none;
  }
  .ps-item{flex:1; text-align:center; position:relative; z-index:1;}
  .ps-item b{display:block; font-size:22px; font-family:var(--font-display); color:var(--lime); line-height:1;}
  .ps-item span{font-size:10px; color:var(--text-1); font-weight:700; margin-top:6px; display:block; text-transform:uppercase; letter-spacing:.02em;}
  .ps-div{width:1px; background:rgba(255,255,255,.1); margin:2px 0;}

  .fav-scroll{display:flex; gap:12px; overflow-x:auto; padding-bottom:2px;}

  .settings-group{
    margin-top:14px; background:var(--slate-700); border:1px solid var(--slate-border);
    border-radius:var(--radius-l); overflow:hidden;
  }
  .settings-row{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    border-bottom:1px solid var(--slate-border);
  }
  .settings-row:last-child{border-bottom:none;}
  .settings-row:active{background:rgba(255,255,255,.03);}
  .settings-icon{
    width:34px; height:34px; border-radius:11px; background:var(--slate-600);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .settings-icon svg{width:16px; height:16px; color:var(--lime);}
  .settings-text{flex:1;}
  .settings-text b{display:block; font-size:13.5px; font-weight:700;}
  .settings-text span{font-size:11px; color:var(--text-1);}
  .switch{width:42px; height:25px; border-radius:14px; background:var(--slate-500); position:relative; flex:none; transition:.2s;}
  .switch::after{content:""; position:absolute; top:2.5px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s;}
  .switch.on{background:var(--lime);}
  .switch.on::after{left:19px;}
  .chevron{width:15px; height:15px; color:var(--text-1); flex:none;}

  .settings-group-label{font-size:11px; color:var(--text-1); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin:22px 4px 8px;}

  .view-only-note{
    display:flex; gap:10px; align-items:flex-start; background:rgba(216,255,62,.08);
    border:1px solid rgba(216,255,62,.25); border-radius:16px; padding:12px 14px; margin-top:16px;
  }
  .view-only-note svg{width:16px; height:16px; color:var(--lime); flex:none; margin-top:1px;}
  .view-only-note p{font-size:11.5px; color:var(--text-1); line-height:1.5;}

  /* ---------- TABBAR ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 14px);
    display:flex; justify-content:center; z-index:1200; pointer-events:none;
  }
  .tabbar-inner{
    pointer-events:all;
    display:flex; gap:4px; background:rgba(16,21,28,.86); backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08); border-radius:24px; padding:6px;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.55);
  }
  .tab-btn{
    width:56px; height:52px; border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; color:var(--text-1); position:relative;
  }
  .tab-btn svg{width:20px; height:20px;}
  .tab-btn span{font-size:9.5px; font-weight:700;}
  .tab-btn.active{background:var(--lime); color:var(--lime-ink);}
  .tab-btn .badge{
    position:absolute; top:6px; right:10px; width:7px; height:7px; border-radius:50%;
    background:var(--coral); box-shadow:0 0 0 2px rgba(16,21,28,.86);
  }

  /* ---------- SHEETS (детальная карточка / фильтры) ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(8,11,15,.66); z-index:1300;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:all;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:1301; max-width:520px; margin:0 auto;
    background:var(--bg-1); border-radius:26px 26px 0 0; border:1px solid var(--slate-border); border-bottom:none;
    max-height:88vh; transform:translateY(102%); transition:transform .32s cubic-bezier(.22,.68,0,1);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-grip{width:38px; height:4px; border-radius:3px; background:var(--slate-500); margin:12px auto 4px;}
  .sheet-scroll{overflow-y:auto; padding:4px 20px 26px;}
  .sheet-gallery{display:flex; gap:8px; overflow-x:auto; margin:14px -20px 16px; padding:0 20px; scroll-snap-type:x mandatory;}
  .sheet-gallery .gallery-item{
    flex:none; width:78%; aspect-ratio:4/3; border-radius:18px; scroll-snap-align:start;
    background:var(--slate-600); position:relative; overflow:hidden;
  }
  .sheet-gallery img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .sheet-price{
    display:inline-flex; align-items:baseline; gap:4px; background:var(--lime); color:var(--lime-ink);
    padding:8px 14px; border-radius:14px; font-weight:800; font-size:16px; font-family:var(--font-display);
  }
  .sheet-price small{font-size:11px; font-weight:700;}
  .sheet h2{font-size:19px; margin-top:14px;}
  .sheet-loc{font-size:13px; color:var(--text-1); margin-top:4px;}
  .sheet-facts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
  .fact{background:var(--slate-700); border:1px solid var(--slate-border); border-radius:14px; padding:12px;}
  .fact span{font-size:10.5px; color:var(--text-1); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .fact b{display:block; font-size:14px; margin-top:4px;}
  .sheet-desc{font-size:13.5px; line-height:1.6; color:var(--text-1); margin-top:18px;}
  .sheet-contact{display:flex; gap:10px; margin-top:20px;}
  .contact-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; border-radius:16px; font-weight:800; font-size:13.5px;}
  .contact-btn.tg{background:var(--sky); color:#0b1a2e;}
  .contact-btn.wa{background:#3ddc84; color:#062012;}
  .close-btn{
    position:absolute; top:14px; right:16px; width:34px; height:34px; border-radius:12px;
    background:var(--slate-700); border:1px solid var(--slate-border); display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .close-btn svg{width:14px; height:14px;}

  .sheet-secondary-actions{display:flex; gap:10px; margin-top:10px;}
  .icon-action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:12px; border-radius:14px; font-weight:700; font-size:12.5px;
    background:var(--slate-700); border:1px solid var(--slate-border); color:var(--text-0);
  }
  .icon-action-btn svg{width:15px; height:15px;}
  .icon-action-btn.fav-active{background:var(--lime); color:var(--lime-ink); border-color:var(--lime);}
  .sheet-map{height:160px; border-radius:16px; overflow:hidden; margin-top:18px; border:1px solid var(--slate-border);}
  .sheet-map .leaflet-container{background:var(--slate-700);}

  /* Leaflet marker: фиксированный якорь исключает визуальное смещение меток */
  .price-marker{
    background:var(--ink); color:var(--lime); font-family:var(--font-display); font-weight:800;
    min-width:52px; height:34px; display:flex; align-items:center; justify-content:center; padding:0 9px; border-radius:12px; white-space:nowrap;
    border:2px solid var(--lime); box-shadow:0 6px 14px -4px rgba(0,0,0,.55);
    animation:markerDrop .28s cubic-bezier(.3,1.4,.5,1) both; transform-origin:50% 100%;
  }
  .price-marker-icon{background:transparent!important; border:0!important;}
  @keyframes markerDrop{from{opacity:0; transform:scale(.5);} to{opacity:1; transform:scale(1);}}
  .price-marker.mine{border-color:var(--sky); color:var(--sky);}
  .cluster-marker{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display);
    font-size:14px; border:3px solid var(--bg-0); box-shadow:0 8px 18px -6px rgba(216,255,62,.5);
    animation:markerDrop .28s cubic-bezier(.3,1.4,.5,1) both;
  }
  .me-marker{
    width:18px; height:18px; border-radius:50%; background:var(--sky); border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(127,183,255,.28); position:relative;
  }
  .me-marker::after{
    content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid rgba(127,183,255,.55);
    animation:pulseRing 1.8s ease-out infinite;
  }
  @keyframes pulseRing{0%{transform:scale(.6); opacity:.9;}100%{transform:scale(2.1); opacity:0;}}
  .leaflet-popup-content-wrapper{background:var(--paper); border-radius:16px; padding:0; overflow:hidden;}
  .leaflet-popup-content{margin:0; width:220px !important;}
  .leaflet-popup-tip{background:var(--paper);}
  .map-popup{cursor:pointer;}
  .map-popup .mp-photo{height:90px; position:relative;}
  .map-popup .mp-body{padding:10px 12px;}
  .map-popup .mp-title{font-size:12.5px; font-weight:800; color:var(--ink); line-height:1.3;}
  .map-popup .mp-price{font-size:12px; font-weight:800; color:var(--ink-soft); margin-top:3px;}
  .leaflet-control-zoom{display:none;} /* заменено собственными круглыми кнопками */
  .leaflet-control-attribution{background:rgba(16,21,28,.7) !important; color:var(--text-1) !important; font-size:9px !important;}
  .leaflet-control-attribution a{color:var(--text-1) !important;}

  /* ---------- FAVORITE HEART + CARD BADGES ---------- */
  .fav-btn{
    position:absolute; top:8px; right:8px; z-index:2; width:30px; height:30px; border-radius:10px;
    background:rgba(20,27,36,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .fav-btn svg{width:15px; height:15px; stroke:#fff; fill:none; stroke-width:2;}
  .fav-btn.active{background:var(--lime);}
  .fav-btn.active svg{fill:var(--lime-ink); stroke:var(--lime-ink);}
  .photo-count-pill{
    font-size:9.5px; font-weight:800; padding:4px 7px; border-radius:8px;
    background:rgba(20,27,36,.72); color:#fff; display:flex; align-items:center; gap:3px;
    position:absolute; bottom:8px; left:8px; z-index:2;
  }
  .photo-count-pill svg{width:10px; height:10px;}
  .new-badge{
    position:absolute; top:8px; left:8px; font-size:9px; font-weight:800; letter-spacing:.03em;
    background:var(--lime); color:var(--lime-ink); padding:4px 8px; border-radius:8px; z-index:2;
  }

  /* ---------- DIAGNOSTIC BANNER ---------- */
  .diag-banner{
    display:flex; gap:12px; align-items:flex-start; background:rgba(255,122,102,.1);
    border:1px solid rgba(255,122,102,.35); border-radius:18px; padding:14px 16px; margin-top:14px;
  }
  .diag-banner svg{width:18px; height:18px; color:var(--coral); flex:none; margin-top:1px;}
  .diag-banner b{display:block; font-size:13.5px; margin-bottom:4px;}
  .diag-banner p{font-size:12px; color:var(--text-1); line-height:1.55;}
  .diag-banner code{background:var(--slate-700); padding:1px 6px; border-radius:6px; font-size:11px;}
</style>
</head>
<body>

<div id="app">

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div id="topAvatar" class="avatar">?</div>
    <div class="topbar-mid">
      <div class="topbar-name" id="topName">Гость</div>
    </div>
    <button class="icon-btn" onclick="goTab('notify')" aria-label="Уведомления">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot-badge" id="notifyDot" style="display:none"></span>
    </button>
    <button class="icon-btn plus-btn" onclick="openBotChat()" aria-label="Разместить объявление">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div id="diagBanner" style="display:none; padding:0 20px;"></div>

  <main>

    <!-- ================= HOME ================= -->
    <section class="screen active" id="screen-home">

      <!-- Начинается сразу с "ближайшего города" — большого круга-счётчика нет -->
      <div class="stat-glance">
        <div class="stat-glance-top">
          <div>
            <div class="sg-label-row">
              <span class="sg-label">Ближайший город</span>
              <button class="sg-locate-btn" id="sgLocateBtn" onclick="detectNearestCity()" aria-label="Определить местоположение">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
              </button>
            </div>
            <div class="sg-city" id="sgCity" onclick="goTab('search')">—</div>
          </div>
          <div class="sg-count-wrap">
            <b id="sgCount">0</b>
            <span>активных</span>
          </div>
        </div>
        <div class="stat-glance-bottom">
          <div class="sg-chip" onclick="openHomeMap()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="10" r="3"/><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/></svg>Смотреть на карте</div>
          <div class="sg-range" id="sgRange">€ — · —</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:22px;">
        <h2>Категории</h2>
        <span class="link" onclick="goTab('search')">Все фильтры →</span>
      </div>
      <div class="category-grid" id="categoryGrid"></div>

      <div class="searchbar" onclick="goTab('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input readonly placeholder="Город, тип жилья, цена…" />
      </div>

      <div class="chip-row" id="cityChips"></div>

      <div class="section-title">
        <h2>Все объявления</h2>
        <span class="link" onclick="openHomeMap()">На карте →</span>
      </div>
      <div class="listing-grid" id="homeList"></div>
    </section>

    <!-- ================= SEARCH (карта на весь экран + шторка с результатами; фильтры скрыты за кнопкой) ================= -->
    <section class="screen" id="screen-search">

      <div class="search-map-screen" id="searchMapScreen">
        <div id="searchMap" style="height:100%;"></div>

        <div class="map-controls" aria-label="Управление картой">
          <button class="map-control-btn" onclick="zoomMap(1)" aria-label="Приблизить карту"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="map-control-btn" onclick="zoomMap(-1)" aria-label="Отдалить карту"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <button class="map-control-btn" id="nearMeBtn" onclick="toggleNearMe()" aria-label="Моё местоположение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
          <button class="map-control-btn" id="mapSettingsBtn" onclick="toggleMapSettings()" aria-label="Настройки карты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.2 2.2-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56v.1h-3.12v-.1A1.7 1.7 0 0 0 10.48 18.7a1.7 1.7 0 0 0-1.88.34l-.06.06-2.2-2.2.06-.06A1.7 1.7 0 0 0 6.74 15a1.7 1.7 0 0 0-1.56-1.03h-.1v-3.12h.1A1.7 1.7 0 0 0 6.74 9.8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.2-2.2.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56v-.1h3.12v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.2 2.2-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.1v3.12h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg></button>
        </div>
        <div class="map-settings" id="mapSettings">
          <div class="map-settings-head">Вид карты</div>
          <div class="map-style-switch">
            <button class="map-style-btn active" data-style="dark" onclick="setMapStyle('dark')">Тёмная</button>
            <button class="map-style-btn" data-style="light" onclick="setMapStyle('light')">Светлая</button>
            <button class="map-style-btn" data-style="sat" onclick="setMapStyle('sat')">Спутник</button>
          </div>
          <button class="map-settings-action" onclick="fitAllMarkers(); closeMapSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/><path d="M3 8l6-5M21 8l-6-5M21 16l-6 5M3 16l6 5"/></svg>Показать все метки</button>
        </div>
        <button class="filter-fab" onclick="openFilterSheet()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="var(--lime-ink)"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="var(--lime-ink)"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="var(--lime-ink)"/></svg>
          Фильтры <span class="fab-badge" id="filterBadge" style="display:none">0</span>
        </button>
      </div>
    </section>

    <!-- ================= NOTIFICATIONS ================= -->
    <section class="screen" id="screen-notify">
      <div class="section-title" style="margin-top:20px;"><h2>Уведомления</h2></div>
      <div class="listing-grid" id="notifyList" style="gap:10px;"></div>
    </section>

    <!-- ================= PROFILE ================= -->
    <section class="screen" id="screen-profile">
      <div class="section-title" style="margin-top:20px;"><h2>Избранное</h2><span class="link" id="favCountLink"></span></div>
      <div class="fav-scroll" id="favoritesList"></div>

      <div class="section-title"><h2>Мои объявления</h2></div>
      <div class="listing-grid" id="myListingsList"></div>
    </section>

  </main>

  <!-- ================= TABBAR ================= -->
  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn active" data-tab="home" onclick="goTab('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span>Главная</span>
      </button>
      <button class="tab-btn" data-tab="search" onclick="goTab('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Поиск</span>
      </button>
      <button class="tab-btn" data-tab="notify" onclick="goTab('notify')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Уведомл.</span>
        <i class="badge" id="tabNotifyBadge" style="display:none"></i>
      </button>
      <button class="tab-btn" data-tab="profile" onclick="goTab('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>
        <span>Профиль</span>
      </button>
    </div>
  </nav>

  <!-- ================= LISTING DETAIL SHEET ================= -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <button class="close-btn" onclick="closeSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="sheet-grip"></div>
    <div class="sheet-scroll" id="sheetContent"></div>
  </div>

  <!-- ================= FILTER SHEET ("расширенный поиск") ================= -->
  <div class="sheet-backdrop" id="filterSheetBackdrop" onclick="closeFilterSheet()"></div>
  <div class="sheet filter-sheet" id="filterSheet">
    <button class="close-btn" onclick="closeFilterSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>

   ITALY HOUSING · Telegram Mini App

   === ФОТО: почему не показывались и как это исправлено ===
   Бот сохраняет в Firestore не публичную ссылку на фото, а Telegram file_id
   (см. italy_housing_bot.py: message.photo[-1].file_id). file_id — это ключ
   внутри Bot API, а не URL: браузер не может открыть его напрямую, для этого
   нужен вызов метода getFile с секретным BOT_TOKEN, которому не место в
   открытом клиентском коде мини-аппы. Поэтому "из коробки" веб-версия фото
   показать не может — это архитектурная особенность Telegram, а не баг вёрстки.
   Ниже — два рабочих решения, front-end уже поддерживает оба:

   1) (рекомендуется, самый надёжный способ) Доработать бота: сразу после
      публикации/одобрения объявления скачивать фото через Bot API и заливать
      их в Firebase Storage, а в Firestore писать уже публичный download-URL
      в массив поля `photo_urls` (не `photos`). Мини-апп ищет `photo_urls`
      В ПЕРВУЮ очередь и покажет их сразу, без всякого прокси.

   2) Поднять маленькую serverless-функцию (Cloudflare Worker / Cloud
      Function / Vercel) со своим BOT_TOKEN внутри, которая по ?file_id=...
      вызывает getFile и отдаёт картинку (редиректом на file.telegram.org).
      Вставьте её адрес в PHOTO_PROXY_URL ниже — мини-апп начнёт сам ей
      пользоваться для старых объявлений, у которых есть только file_id.

      Готовый код такого Cloudflare Worker (создайте новый Worker и вставьте):

      ------------------------------------------------------------------
      const BOT_TOKEN = "ВАШ_ТОКЕН_БОТА";
      export default {
        async fetch(req) {
          const url = new URL(req.url);
          const fileId = url.searchParams.get("file_id");
          if (!fileId) return new Response("file_id required", {status:400});
          const info = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`).then(r=>r.json());
          if (!info.ok) return new Response("not found", {status:404});
          const fileUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${info.result.file_path}`;
          return Response.redirect(fileUrl, 302);
        }
      }
      ------------------------------------------------------------------

      После деплоя скопируйте адрес вида https://xxx.workers.dev и вставьте
      в PHOTO_PROXY_URL. Учтите: у Worker'а будет открытый доступ к вашим
      файлам бота по file_id — на практике это низкий риск (id непредсказуемы

// ---------- 4b. GEO HELPERS + GEOCODING ----------
// Приоритет координат: точные координаты объявления → геокодирование адреса → центр города.
// Искусственный джиттер намеренно убран: он создавал ложное визуальное смещение меток.
let geoCache = {};
let geocodingQueue = [];
let geocodingBusy = false;

function getCoords(l){
  const point = (lat, lng) => {
    lat = Number(lat); lng = Number(lng);
    return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? [lat, lng] : null;
  };
  const addressPoint = point(l.address_lat, l.address_lng);
  if (addressPoint) return addressPoint;
  const directPoint = point(l.lat, l.lng);
  if (directPoint) return directPoint;
  const geoPoint = point(l.location?.latitude, l.location?.longitude);
  if (geoPoint) return geoPoint;
  if (geoCache[l.id]) return geoCache[l.id];
  const base = CITY_COORDS[l.city];
  return base ? [...base] : null;
}
function haversineKm(a, b){
  const toRad = d => d * Math.PI/180;
  const R = 6371;
  const dLat = toRad(b[0]-a[0]), dLng = toRad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function geocodeMissingListings(){
  const targets = allListings.filter(l =>
    !(typeof l.address_lat === "number" && typeof l.address_lng === "number") &&
    !(typeof l.lat === "number" && typeof l.lng === "number") &&
    !geoCache[l.id] && l.address && l.city
  );
  targets.forEach(l => { if (!geocodingQueue.find(x => x.id===l.id)) geocodingQueue.push(l); });
  processGeocodeQueue();
}
async function processGeocodeQueue(){
  if (geocodingBusy) return;
  geocodingBusy = true;
  while (geocodingQueue.length){
    const l = geocodingQueue.shift();
    try{
      const coords = await geocodeOne(l);
      if (coords){
        geoCache[l.id] = coords;
        onGeocodeResolved(l.id);
      }
    } catch(e){ /* тихо пропускаем — останется fallback на центр города */ }
    await new Promise(r => setTimeout(r, 1100)); // не чаще 1 запроса/сек (политика Nominatim)
  }
  geocodingBusy = false;
}
async function geocodeOne(l){
  const cacheKey = geoCacheKey(l.city, l.address);
  if (!FIREBASE_NOT_CONFIGURED){
    try{
      const doc = await db.collection("geocache").doc(cacheKey).get();
      if (doc.exists){ const d = doc.data(); return [d.lat, d.lng]; }
    } catch(e){ /* нет доступа к geocache — просто идём в сеть */ }
  }
  const q = encodeURIComponent(`${l.address}, ${l.city}, Italy`);
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`, {
    headers: {"Accept-Language":"ru"}
  });
  const data = await res.json();
  if (!data || !data[0]) return null;
  const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  if (!FIREBASE_NOT_CONFIGURED){
    db.collection("geocache").doc(cacheKey).set({lat:coords[0], lng:coords[1], q: `${l.address}, ${l.city}`}).catch(()=>{});
  }
  return coords;
}
function geoCacheKey(city, address){
  return hashStr(`${city}|${address}`.toLowerCase()).toString(36);
}
function onGeocodeResolved(id){
  // точечно обновляем карту/шторку/открытую карточку, не перестраивая всё с нуля
  if (searchMap) updateSearchMap(currentFilteredList());
  if (currentSheetId === id) openListing(id);
}
function currentFilteredList(){
  return sortListings(allListings.filter(l => {
    if (filters.city && l.city !== filters.city) return false;
    if (filters.room && l.room !== filters.room) return false;
    if (filters.min && (l.price||0) < Number(filters.min)) return false;
    if (filters.max && (l.price||0) > Number(filters.max)) return false;
    if (filters.q){
      const hay = `${l.city||""} ${l.room||""} ${l.housing_type||""} ${l.address||""} ${l.description||""}`.toLowerCase();
      if (!hay.includes(filters.q)) return false;
    }
    return true;
  }));
}

// "Ближайший город" — если пользователь один раз определил геопозицию (кнопка-таргет),
// используем её и реально ближайший к нему город из CITY_COORDS; иначе — город с
// наибольшим числом активных объявлений (разумный дефолт для первого показа).
function renderStatGlance(){
  const cityEl = document.getElementById("sgCity");
  const countEl = document.getElementById("sgCount");
  const rangeEl = document.getElementById("sgRange");
  if (!cityEl) return;
  const city = filters.city || nearestCityName() || mostCommonCity() || "Италия";
  const inCity = filters.city ? allListings.filter(l => l.city===filters.city) : allListings;
  cityEl.textContent = city;
  countEl.textContent = inCity.length;
  if (inCity.length){
    const prices = inCity.map(l => l.price||0).filter(Boolean);
    rangeEl.textContent = prices.length ? `€${Math.min(...prices)} – €${Math.max(...prices)}` : "€ —";
  } else {
    rangeEl.textContent = "€ —";
  }
}
function nearestCityName(){
  if (!userLoc) return null;
  let best = null, bestDist = Infinity;
  for (const [city, coords] of Object.entries(CITY_COORDS)){
    const d = haversineKm(userLoc, coords);
    if (d < bestDist){ bestDist = d; best = city; }
  }
  return best;
}
function mostCommonCity(){
  const counts = {};
  allListings.forEach(l => { if (l.city) counts[l.city] = (counts[l.city]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  return sorted[0]?.[0];
}
function detectNearestCity(){
  const btn = document.getElementById("sgLocateBtn");
  if (!navigator.geolocation){
    tg?.showAlert?.("Геолокация недоступна в этом браузере.");
    return;
  }
  btn.classList.add("loading");
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLoc = [pos.coords.latitude, pos.coords.longitude];
      btn.classList.remove("loading");
      haptic("medium");
      renderStatGlance();
    },
    () => {
      btn.classList.remove("loading");
      tg?.showAlert?.("Не удалось определить местоположение. Проверьте разрешения.");
    },
    {timeout:8000}
  );
}

function renderCityChips(){

  const cities = [...new Set(allListings.map(l => l.city).filter(Boolean))];
  const list = cities.length ? cities : CITIES;
  wrap.innerHTML = `<button class="chip ${filters.city===""?"active":""}" onclick="pickCity('')">Все города</button>` +
    list.map(c => `<button class="chip ${filters.city===c?"active":""}" onclick="pickCity('${c}')">${c}</button>`).join("");
}

function activeFilterCount(){
  let n = 0;
  if (filters.city) n++;
  if (filters.room) n++;
  if (filters.min) n++;
  if (filters.max) n++;
  if (filters.q) n++;
  return n;
}

function applyFilters(){
  filters.city = document.getElementById("fCity")?.value ?? filters.city;
  filters.min = document.getElementById("fMin")?.value || "";
  filters.max = document.getElementById("fMax")?.value || "";
  filters.q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();

  const list = currentFilteredList();

  const n = activeFilterCount();
  const badge = document.getElementById("filterBadge");
  badge.style.display = n ? "flex" : "none";
  badge.textContent = n;

  updateSearchMap(list);
  renderSortChips();
}

function sortListings(list){
  const copy = [...list];
  if (sortMode === "price_asc") copy.sort((a,b) => (a.price||0) - (b.price||0));
  else if (sortMode === "price_desc") copy.sort((a,b) => (b.price||0) - (a.price||0));
  else if (sortMode === "near" && userLoc){
    copy.sort((a,b) => {
      const ca = getCoords(a), cb = getCoords(b);
      const da = ca ? haversineKm(userLoc, ca) : Infinity;
      const db = cb ? haversineKm(userLoc, cb) : Infinity;
      return da - db;
    });
  } else {
    copy.sort((a,b) => (b.created_at?.seconds||0) - (a.created_at?.seconds||0));
  }
  return copy;
}

const SORT_OPTIONS = [
  ["new", "Сначала новые"],
  ["price_asc", "Дешевле"],
  ["price_desc", "Дороже"],
];

  wrap.innerHTML = opts.map(([val,label]) => `
    <button class="sort-chip ${sortMode===val?"active":""}" onclick="pickSort('${val}')">${label}</button>
  `).join("");
}
function pickSort(mode){
  sortMode = mode;
  haptic("light");
  applyFilters();
}

function pluralListings(n){
  const m10 = n%10, m100 = n%100;
  if (m10===1 && m100!==11) return "объявление";
  if ([2,3,4].includes(m10) && ![12,13,14].includes(m100)) return "объявления";
  return "объявлений";
}

// ---------- 6c. SUPER MAP: init, clustering, style switch, controls ----------
function ensureSearchMap(){
  if (searchMap) { setTimeout(() => searchMap.invalidateSize(), 60); return; }
  searchMap = L.map("searchMap", {zoomControl:false, attributionControl:true, tap:true}).setView([42.5, 12.5], 5.4);
  currentTileLayer = L.tileLayer(MAP_TILE_LAYERS.dark.url, {
    attribution: MAP_TILE_LAYERS.dark.attribution,
    maxZoom: MAP_TILE_LAYERS.dark.maxZoom, subdomains: MAP_TILE_LAYERS.dark.subdomains || "abc"
  }).addTo(searchMap);
  clusterGroup = L.markerClusterGroup({
    iconCreateFunction: cluster => {
      const n = cluster.getChildCount();
      // Плотность кластера мягко влияет на цвет — от лайма (мало) к коралловому (много)
      const t = Math.min(1, n / 25);
      const color = mixColor([216,255,62], [255,122,102], t);
      return L.divIcon({
        html: `<div class="cluster-marker" style="background:${color}; color:${t>0.55 ? "#2a0d08" : "#1c2606"};">${n}</div>`,
        className: "", iconSize: [46,46], iconAnchor: [23,23],
      });
    },
    maxClusterRadius: 52,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    animate: true,
  });
  searchMap.addLayer(clusterGroup);
  setTimeout(() => searchMap.invalidateSize(), 60);
  updateSearchMap(currentFilteredList());
}
function mixColor(a, b, t){
  const c = a.map((v,i) => Math.round(v + (b[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function setMapStyle(style){
  if (!MAP_TILE_LAYERS[style] || !searchMap) return;
  currentMapStyle = style;
  haptic("light");
  if (currentTileLayer) searchMap.removeLayer(currentTileLayer);
  const cfg = MAP_TILE_LAYERS[style];
  currentTileLayer = L.tileLayer(cfg.url, {attribution:cfg.attribution, maxZoom:cfg.maxZoom, subdomains:cfg.subdomains || "abc"}).addTo(searchMap);
  currentTileLayer.bringToBack();
  document.querySelectorAll(".map-style-btn").forEach(b => b.classList.toggle("active", b.dataset.style === style));
}

function toggleMapSettings(){
  const panel = document.getElementById("mapSettings");
  const button = document.getElementById("mapSettingsBtn");
  const isOpen = panel.classList.toggle("open");
  button.classList.toggle("active", isOpen);
  haptic("light");
}
function closeMapSettings(){
  document.getElementById("mapSettings")?.classList.remove("open");
  document.getElementById("mapSettingsBtn")?.classList.remove("active");
}
function zoomMap(delta){
  if (!searchMap) return;
  searchMap.setZoom(searchMap.getZoom() + delta, {animate:true});
  haptic("light");
}

function updateSearchMap(list){
  if (!searchMap || !clusterGroup) return;
  clusterGroup.clearLayers();

  const bounds = [];
  list.forEach(l => {
    const coords = getCoords(l);
    if (!coords) return;
    const mine = tgUser && l.owner_id === tgUser.id;
    const icon = L.divIcon({
      className: "price-marker-icon",
      html: `<div class="price-marker ${mine?"mine":""}">€${l.price ?? "–"}</div>`,
      iconSize: [52,34], iconAnchor: [26,34], popupAnchor: [0,-34],
    });
    const marker = L.marker(coords, {icon, riseOnHover:true, keyboard:true});
    marker.bindPopup(`
      <div class="map-popup" onclick="closePopupAndOpen('${l.id}')">
        <div class="mp-photo">${photoBlockHTML(l)}</div>
        <div class="mp-body">
          <div class="mp-title">${esc(l.housing_type||"Жильё")}, ${esc(ROOM_LABEL_RU[l.room]||l.room||"")}</div>
          <div class="mp-price">€${l.price ?? "–"}/мес · ${esc(l.city||"")}</div>
        </div>
      </div>`);
    clusterGroup.addLayer(marker);
    bounds.push(coords);
  });

  if (bounds.length && !userLoc && !mapHasInitialFit){
    searchMap.fitBounds(bounds, {padding:[52,52], maxZoom:13});
    mapHasInitialFit = true;
  }
}
function closePopupAndOpen(id){ openListing(id); }

function fitAllMarkers(){
  haptic("light");
  const list = currentFilteredList();
  const bounds = list.map(getCoords).filter(Boolean);
  if (bounds.length) searchMap.fitBounds(bounds, {padding:[52,52], maxZoom:13});
}

function toggleNearMe(){
  const btn = document.getElementById("nearMeBtn");
  if (userLoc){
    userLoc = null;
    sortMode = "new";
    btn.classList.remove("active");
    if (meMarker){ searchMap.removeLayer(meMarker); meMarker = null; }
    applyFilters();
    fitAllMarkers();
    return;
  }
  if (!navigator.geolocation){
    tg?.showAlert?.("Геолокация недоступна в этом браузере.");
    return;
  }
  btn.classList.add("loading");
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLoc = [pos.coords.latitude, pos.coords.longitude];
      sortMode = "near";
      btn.classList.remove("loading");
      btn.classList.add("active");
      haptic("medium");
      if (meMarker) searchMap.removeLayer(meMarker);
      meMarker = L.marker(userLoc, {icon: L.divIcon({className:"", html:`<div class="me-marker"></div>`, iconSize:[18,18], iconAnchor:[9,9]})}).addTo(searchMap);
      searchMap.setView(userLoc, 12);
      applyFilters();
      renderStatGlance();
    },
    () => {
      btn.classList.remove("loading");
      tg?.showAlert?.("Не удалось определить местоположение. Проверьте разрешения.");
    },
    {timeout:8000}
  );
}

      ${coords ? `<a class="icon-action-btn" href="https://www.google.com/maps?q=${coords[0]},${coords[1]}" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        В картах
      </a>` : ""}
    </div>

    <div class="sheet-contact">
      ${l.username ? `<a class="contact-btn tg" href="https://t.me/${l.username}" target="_blank">✉️ Telegram</a>` : ""}
      ${(l.whatsapp || l.phone) ? `<a class="contact-btn wa" href="https://wa.me/${(l.whatsapp||l.phone).replace(NON_DIGIT_RE,"")}" target="_blank">🟢 WhatsApp</a>` : ""}
    </div>
  `;

  document.getElementById("sheetBackdrop").classList.add("open");
  document.getElementById("sheet").classList.add("open");
  tg?.BackButton?.show();

  if (coords){
    setTimeout(() => {
      if (sheetMapInstance){ sheetMapInstance.remove(); sheetMapInstance = null; }
      const mapEl = document.getElementById("sheetMap");
      if (!mapEl) return;
      const cfg = MAP_TILE_LAYERS[currentMapStyle] || MAP_TILE_LAYERS.dark;
      sheetMapInstance = L.map("sheetMap", {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, touchZoom:false, doubleClickZoom:false}).setView(coords, 14);
      L.tileLayer(cfg.url, {maxZoom:cfg.maxZoom, subdomains:cfg.subdomains || "abc"}).addTo(sheetMapInstance);
      L.marker(coords, {icon: L.divIcon({className:"price-marker-icon", html:`<div class="price-marker">€${l.price ?? "–"}</div>`, iconSize:[52,34], iconAnchor:[26,34]})}).addTo(sheetMapInstance);
      setTimeout(() => sheetMapInstance.invalidateSize(), 60);
    }, 80);
  }
}

function toggleFavoriteInSheet(id){
  toggleFavorite(id);
  if (currentSheetId === id) openListing(id);
}

function shareListing(id){
  const l = allListings.find(x => x.id===id) || myListings.find(x => x.id===id);
  if (!l) return;
  const text = `${l.housing_type||"Жильё"}, ${ROOM_LABEL_RU[l.room]||l.room||""} · ${l.city||""} · €${l.price ?? "–"}/мес`;
  if (tg?.switchInlineQuery){
    tg.switchInlineQuery(text, ["users","groups"]);
  } else if (navigator.share){
    navigator.share({title:"Italy Housing", text}).catch(()=>{});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => tg?.showAlert?.("Скопировано в буфер обмена"));
  }
}

function closeSheet(){
  document.getElementById("sheetBackdrop").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
  if (!filterSheetOpenState) tg?.BackButton?.hide();
  if (sheetMapInstance){ sheetMapInstance.remove(); sheetMapInstance = null; }
  currentSheetId = null;
}

// ---------- 10. NOTIFICATIONS ----------
function loadNotifications(){
  const el = document.getElementById("notifyList");
  if (!tgUser){
    el.innerHTML = emptyHTML("Нет доступа", "Откройте через Telegram, чтобы получать уведомления.");
    return;
  }
  db.collection("notifications").where("user_id","==", tgUser.id)
    .orderBy("created_at","desc").limit(30)
    .onSnapshot(snap => {
      const items = snap.docs.map(d => d.data());
      const unread = items.filter(n => !n.read).length;
      document.getElementById("notifyDot").style.display = unread ? "block" : "none";
      document.getElementById("tabNotifyBadge").style.display = unread ? "block" : "none";
      el.innerHTML = items.length ? items.map(n => `
        <div class="settings-row" style="align-items:flex-start; border-bottom:none;">
          <div class="settings-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></div>
          <div class="settings-text"><b>${esc(n.title || "Новое объявление")}</b><span>${esc(n.body || "")}</span></div>
        </div>`).join("") : emptyHTML("Пока тихо", "Сохраните поиск в боте — и здесь появятся уведомления о новых вариантах.");
    }, () => {
      el.innerHTML = emptyHTML("Пока тихо", "Сохраните поиск в боте — и здесь появятся уведомления о новых вариантах.");
    });
}

// ---------- 11. SETTINGS ----------
function toggleSetting(key){
  settings[key] = !settings[key];
  document.getElementById(key === "notif" ? "switchNotif" : "switchHaptics").classList.toggle("on", settings[key]);
  haptic("light");
  if (tgUser){
    db.collection("users").doc(String(tgUser.id)).set({
      [`mini_app_${key}`]: settings[key],
    }, {merge:true}).catch(()=>{});
  }
}
function openBotChat(){ tg?.openTelegramLink?.(`https://t.me/${BOT_USERNAME}`); }
function openSupport(){ tg?.openTelegramLink?.(`https://t.me/${SUPPORT_USERNAME}`); }
function manageListingInBot(id, action){
  tg?.openTelegramLink?.(`https://t.me/${BOT_USERNAME}?start=${action}_${id}`);
}

function loadUserDoc(){
  if (!tgUser) { renderFavorites(); return; }
  db.collection("users").doc(String(tgUser.id)).onSnapshot(doc => {
    const data = doc.data() || {};
    if (typeof data.mini_app_notif === "boolean") settings.notif = data.mini_app_notif;
    if (typeof data.mini_app_haptics === "boolean") settings.haptics = data.mini_app_haptics;
    document.getElementById("switchNotif")?.classList.toggle("on", settings.notif);
    document.getElementById("switchHaptics")?.classList.toggle("on", settings.haptics);

    favorites = new Set(data.favorites || []);
    refreshFavoriteUI();
  }, err => {
    console.error("user doc error", err);
    renderFavorites();
  });
}

function openHomeMap(){
  goTab("search");
}

// ---------- 12. TABS ----------
function goTab(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  haptic("light");
  window.scrollTo({top:0, behavior:"instant"});
  if (name === "search") ensureSearchMap();
}

// ---------- 13. BOOT ----------
(function boot(){
  initTelegram();
  renderUser();
  loadListings();
  loadMyListings();
  loadNotifications();
  loadUserDoc();
})();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161C">
<title>Italy Housing · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* =========================================================
   TOKENS
========================================================= */
:root{
  --bg:#12161C; --surface:#171C24; --surface-2:#1E2430; --surface-3:#242B38;
  --border:#2A323D; --border-soft:#20262F;
  --text:#EDEFF2; --text-dim:#9BA3B0; --text-faint:#5B6472;
  --accent:#5B9BD1; --accent-soft:rgba(91,155,209,.14); --accent-strong:#7FB2E0;
  --green:#5FA777; --green-soft:rgba(95,167,119,.14);
  --amber:#D6A24A; --amber-soft:rgba(214,162,74,.14);
  --red:#C1594F; --red-soft:rgba(193,89,79,.14);
  --violet:#8E86C9; --violet-soft:rgba(142,134,201,.14);
  --serif:'Newsreader',Georgia,serif; --sans:'IBM Plex Sans',-apple-system,sans-serif; --mono:'IBM Plex Mono',monospace;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shell-max:1360px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#EEF0EF; --surface:#FFFFFF; --surface-2:#F6F7F6; --surface-3:#EEF0EF;
  --border:#DBDFDD; --border-soft:#E5E8E6;
  --text:#1B2027; --text-dim:#5B6472; --text-faint:#8B93A1;
  --accent:#2E6B9E; --accent-soft:rgba(46,107,158,.10); --accent-strong:#1F5480;
  --green:#3E8B62; --green-soft:rgba(62,139,98,.10);
  --amber:#B9791F; --amber-soft:rgba(185,121,31,.10);
  --red:#A8443B; --red-soft:rgba(168,68,59,.10);
  --violet:#6B62A8; --violet-soft:rgba(107,98,168,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
body{font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
::selection{background:var(--accent-soft);}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.1px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

/* =========================================================
   APP SHELL
========================================================= */
#app{display:flex;height:100%;min-height:100%;}

/* ---- Sidebar (desktop) ---- */
#sidebar{
  width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100%;position:sticky;top:0;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--border-soft);}
.brand-mark{display:flex;align-items:center;gap:10px;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.brand-title{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.2px;}
.brand-sub{color:var(--text-faint);font-size:11.5px;margin-top:5px;letter-spacing:.3px;}
nav.primary-nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-s);
  color:var(--text-dim);cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:2px;
  border:1px solid transparent;transition:background .12s,color .12s;user-select:none;
}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--text);border-color:rgba(91,155,209,.25);}
.nav-item.active svg{color:var(--accent);opacity:1;}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint);background:var(--surface-3);padding:1px 6px;border-radius:20px;}
.nav-item.active .nav-count{color:var(--accent);}
.nav-section-label{font-size:10.5px;text-transform:none;color:var(--text-faint);padding:14px 12px 6px;letter-spacing:.2px;}

.sidebar-foot{border-top:1px solid var(--border-soft);padding:12px 14px;display:flex;align-items:center;gap:8px;}
.conn-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-dim);flex:1;min-width:0;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px;}
.conn-dot.warn{background:var(--amber);}
.conn-dot.bad{background:var(--red);}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;border-radius:var(--radius-s);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 30px;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}

/* ---- Main column ---- */
#main-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}
#topbar{
  height:60px;flex:0 0 60px;border-bottom:1px solid var(--border);background:var(--bg);
  display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:20;
}
#topbar h1{font-size:19px;white-space:nowrap;}
#topbar .topbar-meta{color:var(--text-faint);font-size:12px;margin-left:2px;white-space:nowrap;display:none;}
.search-wrap{flex:1;max-width:380px;position:relative;margin-left:auto;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}
.search-wrap input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px 8px 32px;border-radius:20px;font-size:13px;font-family:inherit;
}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-wrap input:focus{border-color:var(--accent);}
#clock{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);white-space:nowrap;display:none;}

#view-port{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.view{max-width:var(--shell-max);margin:0 auto;padding:22px 22px calc(40px + var(--safe-b));}
.view[hidden]{display:none;}

/* =========================================================
   PRIMITIVES
========================================================= */
.hairline{height:1px;background:var(--border);}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.field{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-s);
  padding:7px 10px;font-size:12.5px;font-family:inherit;
}
.field:focus{border-color:var(--accent);}
select.field{cursor:pointer;}
.toolbar input.field{min-width:180px;flex:1 1 180px;}
.toolbar .spacer{flex:1;}
.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);padding:7px 12px;border-radius:var(--radius-s);font-size:12.5px;font-weight:500;cursor:pointer;
}
.btn svg{width:13px;height:13px;}
.btn:hover{background:var(--surface-3);}
.btn.ghost{background:transparent;}
.chip-toggle{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px;}
.chip-toggle button{border:none;background:transparent;color:var(--text-dim);padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:500;}
.chip-toggle button.active{background:var(--accent);color:#fff;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.2px;white-space:nowrap;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.b-green{background:var(--green-soft);color:var(--green);}
.badge.b-amber{background:var(--amber-soft);color:var(--amber);}
.badge.b-red{background:var(--red-soft);color:var(--red);}
.badge.b-grey{background:var(--surface-3);color:var(--text-faint);}
.badge.b-accent{background:var(--accent-soft);color:var(--accent);}
.badge.b-violet{background:var(--violet-soft);color:var(--violet);}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;}
.section-head h2{font-size:16px;}
.section-head .hint{color:var(--text-faint);font-size:11.5px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);}
.pad{padding:18px;}
.empty-state{padding:48px 20px;text-align:center;color:var(--text-faint);}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}
.empty-state .em-title{color:var(--text-dim);font-size:13.5px;font-weight:500;margin-bottom:4px;}
.loading-row{padding:30px;text-align:center;color:var(--text-faint);font-size:12.5px;}

/* KPI ledger */
.ledger{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);overflow:hidden;margin-bottom:20px;}
.led-item{flex:1;padding:16px 20px;position:relative;min-width:120px;}
.led-item + .led-item{border-left:1px solid var(--border-soft);}
.led-label{font-size:11px;color:var(--text-faint);letter-spacing:.2px;margin-bottom:6px;}
.led-num{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1;}
.led-sub{font-size:11px;color:var(--text-faint);margin-top:6px;}
.led-sub.up{color:var(--green);}
@media (max-width:900px){.ledger{flex-wrap:wrap;}.led-item{flex:1 1 45%;border-left:none !important;border-top:1px solid var(--border-soft);}.led-item:nth-child(-n+2){border-top:none;}}

.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:20px;}
@media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
.chart-wrap{height:230px;position:relative;}
.chart-wrap canvas{max-width:100%;}

.bar-rank{display:flex;flex-direction:column;gap:10px;}
.bar-rank-row{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:12px;}
.bar-rank-row .rlabel{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:5px;}
.bar-rank-row .rval{font-family:var(--mono);color:var(--text-faint);text-align:right;font-size:11.5px;}

.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:12px;padding:10px 0;position:relative;}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:-4px;width:1px;background:var(--border);}
.tl-dot{width:29px;height:29px;border-radius:50%;flex:0 0 29px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);}
.tl-dot svg{width:14px;height:14px;}
.tl-body{padding-top:3px;min-width:0;}
.tl-title{font-size:13px;}
.tl-title b{font-weight:600;}
.tl-time{font-size:11px;color:var(--text-faint);margin-top:2px;}

/* Tables */
.table-scroll{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:12.8px;}
table.data-table th{
  text-align:left;font-size:11px;font-weight:600;color:var(--text-faint);letter-spacing:.2px;
  padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;
}
table.data-table th.sortable:hover{color:var(--text);}
table.data-table th .arrow{margin-left:4px;opacity:.6;font-size:10px;}
table.data-table td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.data-table tbody tr{cursor:pointer;}
table.data-table tbody tr:hover{background:var(--surface-2);}
.td-strong{color:var(--text);font-weight:500;}
.td-dim{color:var(--text-faint);}
.mono-sm{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:600;color:var(--text-dim);flex:0 0 30px;overflow:hidden;border:1px solid var(--border-soft);
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.name-cell{display:flex;align-items:center;gap:10px;}
.name-cell .n-meta{min-width:0;}
.name-cell .n-name{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;}
.name-cell .n-sub{color:var(--text-faint);font-size:11.5px;}

@media (max-width:760px){
  table.data-table thead{display:none;}
  table.data-table, table.data-table tbody, table.data-table tr, table.data-table td{display:block;width:100%;}
  table.data-table tr{border:1px solid var(--border);border-radius:var(--radius-m);margin-bottom:10px;padding:10px 12px;background:var(--surface);}
  table.data-table td{border:none;padding:5px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  table.data-table td[data-label]::before{content:attr(data-label);color:var(--text-faint);font-size:11px;flex:0 0 auto;margin-right:10px;}
  table.data-table td.cell-name::before{display:none;}
  table.data-table td.cell-name{justify-content:flex-start;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--border-soft);}
}

/* Listing / friend cards grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px;}
.lst-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;}
.lst-card:hover{border-color:var(--accent);}
.lst-thumb{height:150px;background:var(--surface-2);position:relative;overflow:hidden;}
.lst-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.lst-thumb .ph-count{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:10px;}
.lst-thumb .no-photo{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:11px;}
.lst-badge-row{position:absolute;top:8px;left:8px;display:flex;gap:5px;}
.lst-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.lst-price{font-family:var(--serif);font-size:19px;font-weight:600;}
.lst-title{font-size:12.5px;color:var(--text-dim);}
.lst-meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:11px;color:var(--text-faint);}

.friend-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;cursor:pointer;}
.friend-card:hover{border-color:var(--accent);}
.friend-top{display:flex;gap:10px;align-items:center;}
.friend-top .avatar{width:38px;height:38px;font-size:13px;}
.friend-name{font-weight:500;}
.friend-sub{color:var(--text-faint);font-size:11.5px;}
.friend-bio{margin-top:10px;font-size:12px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

.review-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-soft);}
.review-item:last-child{border-bottom:none;}
.review-body{flex:1;min-width:0;}
.review-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.review-text{font-size:13px;color:var(--text-dim);white-space:pre-wrap;}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none;}
#modal-root.open{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(6,8,11,.6);backdrop-filter:blur(2px);}
.modal-shell{
  position:absolute;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--surface);
  border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.25);
  animation:slidein .18s ease-out;
}
@keyframes slidein{from{transform:translateX(24px);opacity:.4;}to{transform:translateX(0);opacity:1;}}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.modal-head h3{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-body{flex:1;overflow-y:auto;padding:18px;}
.modal-close{background:none;border:1px solid var(--border);width:28px;height:28px;border-radius:50%;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 28px;}
.modal-close svg{width:13px;height:13px;}
.gallery{position:relative;height:230px;background:var(--surface-2);border-radius:var(--radius-m);overflow:hidden;margin-bottom:16px;}
.gallery img{width:100%;height:100%;object-fit:cover;}
.gallery .gnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;width:28px;height:28px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.gallery .gnav.prev{left:8px;}.gallery .gnav.next{right:8px;}
.gallery .gcount{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;}
.dl-grid{display:grid;grid-template-columns:1fr;gap:0;}
.dl-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.8px;}
.dl-row .k{color:var(--text-faint);flex:0 0 42%;}
.dl-row .v{color:var(--text);text-align:right;flex:1;}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
.modal-actions a.btn{color:var(--text);}
.subhead{font-size:11px;color:var(--text-faint);letter-spacing:.3px;margin:18px 0 8px;padding-top:2px;}
.subhead:first-child{margin-top:0;}
.link-list a{display:block;padding:6px 0;font-size:12.8px;}

/* toast / banners */
#toast-stack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.err-banner{background:var(--red-soft);border:1px solid rgba(193,89,79,.35);color:var(--red);padding:10px 14px;border-radius:var(--radius-m);font-size:12.5px;margin-bottom:14px;}

/* boot splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s;}
#splash .s-mark{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1);}}
#splash .s-text{font-family:var(--serif);font-size:15px;color:var(--text-dim);}

/* Mobile bottom nav */
#mobile-nav{display:none;}
@media (max-width:860px){
  #sidebar{display:none;}
  #topbar .topbar-meta{display:none !important;}
  #clock{display:none !important;}
  .view{padding:16px 14px calc(84px + var(--safe-b));}
  #mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(60px + var(--safe-b));padding-bottom:var(--safe-b);
    background:var(--surface);border-top:1px solid var(--border);z-index:50;
  }
  .mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-faint);font-size:10px;cursor:pointer;border:none;background:none;font-family:inherit;}
  .mnav-item svg{width:19px;height:19px;}
  .mnav-item.active{color:var(--accent);}
  .modal-shell{width:100%;}
  .grid-2{gap:12px;}
}
@media (min-width:861px){
  .search-wrap{display:block;}
  #topbar .topbar-meta{display:inline;}
  #clock{display:inline;}
}
@media (max-width:520px){
  .search-wrap{max-width:none;flex:1;}
  #topbar h1{font-size:16px;}
}

/* =========================================================================================
   REFERENCE DATA (mirrors the bot's own vocab, for consistent labels)
========================================================================================= */
const COUNTRY_LABELS = {
  Russia:"🇷🇺 Россия", Ukraine:"🇺🇦 Украина", Belarus:"🇧🇾 Беларусь", Kazakhstan:"🇰🇿 Казахстан",

  Armenia:"🇦🇲 Армения", Azerbaijan:"🇦🇿 Азербайджан", Other:"🌍 Другая страна",
};
const ROOM_LABELS = { Single:"Одноместная", Double:"Двухместная", Triple:"Трёхместная", Studio:"Студия", "Whole apartment":"Вся квартира", "Bed place":"Койко-место" };
const GENDER_LABELS = { all:"👥 Для всех", male:"👨 Только парни", female:"👩 Только девушки" };
const PRICE_TYPE_LABELS = { property:"за всё жильё", person:"за человека" };
const STATUS_META = {
  pending:{label:"На модерации", cls:"b-amber"},
  approved:{label:"Опубликовано", cls:"b-green"},
  rejected:{label:"Отклонено", cls:"b-red"},
};
const NO_LIMIT = 1e9;

/* =========================================================================================
   HELPERS
========================================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toDate(v){
  if(!v) return null;
  if(v.toDate) try{ return v.toDate(); }catch(e){ return null; }
  if(v instanceof Date) return v;
  return null;
}
function fmtDateTime(v){
  const d = toDate(v); if(!d) return '—';
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(v){
  const d = toDate(v); if(!d) return '—';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
}
function timeAgo(v){
  const d = toDate(v); if(!d) return '—';
  const s = (Date.now()-d.getTime())/1000;
  if(s<0) return fmtDateShort(v);
  if(s<60) return 'только что';
  if(s<3600) return Math.floor(s/60)+' мин назад';
  if(s<86400) return Math.floor(s/3600)+' ч назад';
  if(s<86400*7) return Math.floor(s/86400)+' дн назад';
  return fmtDateShort(v);
}
function money(n){ if(n==null||n==='') return '—'; return '€'+Number(n).toLocaleString('ru-RU'); }
function initials(name, fallback){
  const s=(name||fallback||'?').trim(); if(!s) return '?';
  const parts=s.split(/\s+/).filter(Boolean);
  return ((parts[0]||'')[0]+(parts[1]?parts[1][0]:'')).toUpperCase() || s[0].toUpperCase();
}
function countryLabel(c){ return c ? (COUNTRY_LABELS[c]||c) : '—'; }
function roomLabel(r){ return r ? (ROOM_LABELS[r]||r) : '—'; }
function genderLabel(g){ return g ? (GENDER_LABELS[g]||g) : '—'; }
function priceTypeLabel(p){ return p ? (PRICE_TYPE_LABELS[p]||p) : ''; }
function utilitiesLabel(u){
  if(u===true) return 'Есть, уточняется лично';
  if(u===false || u==null || u==='') return 'Нет';
  return money(u);
}
function statusBadge(status, active){
  const meta = STATUS_META[status] || (active ? STATUS_META.approved : STATUS_META.pending);
  return '<span class="badge '+meta.cls+'">'+meta.label+'</span>';
}
function boolBadge(v, yes, no){
  return v ? '<span class="badge b-green">'+(yes||'Да')+'</span>' : '<span class="badge b-grey">'+(no||'Нет')+'</span>';
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function telHref(p){ return p ? 'tel:'+String(p).replace(/[^\d+]/g,'') : null; }
function waHref(p){ return p ? 'https://wa.me/'+String(p).replace(/\D/g,'') : null; }
function tgHref(u){ return u ? 'https://t.me/'+String(u).replace(/^@/,'') : null; }
function mapsHref(lat,lng){ return (lat!=null && lng!=null) ? 'https://maps.google.com/?q='+lat+','+lng : null; }
function firstPhoto(x){ const p = x.photo_urls || x.photos || []; return p && p.length ? p[0] : null; }
function allPhotos(x){ return x.photo_urls || x.photos || []; }
function csvEscape(v){ v = v==null?'':String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(',')));
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Файл '+filename+' скачан');
}
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.getElementById('toast-stack').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function matches(hay, needle){ return String(hay==null?'':hay).toLowerCase().includes(needle); }

/* =========================================================================================
   DATA STORE + REALTIME LISTENERS (read-only: onSnapshot only, never set/update/delete)
========================================================================================= */
const STORE = { users:[], listings:[], friends:[], reviews:[], subs:[], config:null };
const LOAD = { users:'loading', listings:'loading', friends:'loading', reviews:'loading', subs:'loading', config:'loading' };
const ERRORS = {};
let firstLoadDone = false;

function checkFirstLoad(){
  if(firstLoadDone) return;
  const keys = Object.keys(LOAD);
  if(keys.every(k => LOAD[k] !== 'loading')){
    firstLoadDone = true;
    const splash = document.getElementById('splash');
    splash.style.opacity='0';
    setTimeout(()=> splash.remove(), 320);
  }
}
function setConn(level, text){
  const dot = document.getElementById('conn-dot'), t = document.getElementById('conn-text');
  dot.className = 'conn-dot'+(level==='warn'?' warn':level==='bad'?' bad':'');
  t.textContent = text;
}
function attach(name, colName, mapFn, sortFn){
  db.collection(colName).onSnapshot(
    snap => {
      LOAD[name] = 'ok';
      delete ERRORS[name];
      STORE[name] = snap.docs.map(d => mapFn(d.id, d.data()));
      if(sortFn) STORE[name].sort(sortFn);
      checkFirstLoad();
      renderAll();
      updateConnBanner();
    },
    err => {
      LOAD[name] = 'error';
      ERRORS[name] = err.message || String(err);
      checkFirstLoad();
      renderAll();
      updateConnBanner();
    }
  );
}
function updateConnBanner(){
  const errKeys = Object.keys(ERRORS);
  if(errKeys.length){ setConn('bad', errKeys.length+' коллекц. недоступны'); }
  else { setConn('ok', 'Синхронизировано · realtime'); }
}

attach('users', 'users', (id,d)=>({id, ...d}), (a,b)=> (toDate(b.first_seen)||0) - (toDate(a.first_seen)||0));
attach('listings', 'listings', (id,d)=>({id, ...d}), (a,b)=> (toDate(b.created_at)||0) - (toDate(a.created_at)||0));
attach('friends', 'friend_profiles', (id,d)=>({id, ...d}));
attach('reviews', 'reviews', (id,d)=>({id, ...d}), (a,b)=> (toDate(b.created_at)||0) - (toDate(a.created_at)||0));
attach('subs', 'subscriptions', (id,d)=>({id, ...d}), (a,b)=> (toDate(b.created_at)||0) - (toDate(a.created_at)||0));

db.collection('config').doc('main').onSnapshot(
  doc => { LOAD.config = 'ok'; STORE.config = doc.exists ? doc.data() : null; checkFirstLoad(); renderAll(); },
  err => { LOAD.config = 'error'; ERRORS.config = err.message||String(err); checkFirstLoad(); renderAll(); }
);

setInterval(()=>{
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('ru-RU');
}, 1000);

/* helper cross-refs */
function userById(id){ return STORE.users.find(u=>String(u.id)===String(id)) || null; }
function listingsByOwner(id){ return STORE.listings.filter(l=>String(l.owner_id)===String(id)); }

/* =========================================================================================
   NAVIGATION
========================================================================================= */
const NAV_ITEMS = [
  {key:'dashboard', label:'Дашборд', icon:'dashboard'},
  {key:'users', label:'Пользователи', icon:'users', count:()=>STORE.users.length},
  {key:'listings', label:'Объявления', icon:'home', count:()=>STORE.listings.length},
  {key:'friends', label:'Люди', icon:'people', count:()=>STORE.friends.length},
  {key:'reviews', label:'Отзывы', icon:'star', count:()=>STORE.reviews.length},
  {key:'subs', label:'Подписки', icon:'bell', count:()=>STORE.subs.length},
  {key:'config', label:'Конфигурация', icon:'sliders'},
];
const MOBILE_PRIMARY = ['dashboard','users','listings'];
let currentView = 'dashboard';

function buildNav(){
  const nav = document.getElementById('primary-nav');
  nav.innerHTML = NAV_ITEMS.map(it => navItemHtml(it)).join('');
  nav.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', ()=> showView(el.dataset.key)));

  const mnav = document.getElementById('mobile-nav');
  const primary = NAV_ITEMS.filter(it=>MOBILE_PRIMARY.includes(it.key));
  mnav.innerHTML = primary.map(it => mobileItemHtml(it)).join('') +
    '<button class="mnav-item" id="mnav-more">'+I('more')+'<span>Ещё</span></button>';
  mnav.querySelectorAll('.mnav-item[data-key]').forEach(el => el.addEventListener('click', ()=> showView(el.dataset.key)));
  document.getElementById('mnav-more').addEventListener('click', openMoreSheet);

  const sheetItems = NAV_ITEMS.filter(it=>!MOBILE_PRIMARY.includes(it.key));
  document.getElementById('sheet-panel').innerHTML = sheetItems.map(it=>navItemHtml(it)).join('');
  document.getElementById('sheet-panel').querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ closeMoreSheet(); showView(el.dataset.key); });
  });
}
function navItemHtml(it){
  const cnt = it.count ? it.count() : null;
  return '<div class="nav-item" data-key="'+it.key+'">'+I(it.icon)+'<span>'+it.label+'</span>'+(cnt!=null?'<span class="nav-count">'+cnt+'</span>':'')+'</div>';
}
function mobileItemHtml(it){
  return '<button class="mnav-item" data-key="'+it.key+'">'+I(it.icon)+'<span>'+it.label+'</span></button>';
}
function openMoreSheet(){ document.getElementById('more-sheet').classList.add('open'); }
function closeMoreSheet(){ document.getElementById('more-sheet').classList.remove('open'); }
document.querySelectorAll('[data-close-sheet]').forEach(el=>el.addEventListener('click', closeMoreSheet));

const VIEW_META = {
  dashboard:{title:'Дашборд', sub:'Общая картина проекта'},
  users:{title:'Пользователи', sub:'Все, кто запускал бота'},
  listings:{title:'Объявления', sub:'Жильё в поиске и на модерации'},
  friends:{title:'Люди', sub:'Публичные анкеты из раздела «Люди»'},
  reviews:{title:'Отзывы', sub:'Отзывы пользователей'},
  subs:{title:'Подписки', sub:'Сохранённые поиски жильцов'},
  config:{title:'Конфигурация', sub:'Служебные настройки бота'},
};
function showView(key){
  currentView = key;
  document.querySelectorAll('.view').forEach(v=> v.hidden = (v.id !== 'view-'+key));
  document.querySelectorAll('#primary-nav .nav-item').forEach(el=> el.classList.toggle('active', el.dataset.key===key));
  document.querySelectorAll('#mobile-nav .mnav-item[data-key]').forEach(el=> el.classList.toggle('active', el.dataset.key===key));
  const meta = VIEW_META[key];
  document.getElementById('view-title').textContent = meta.title;
  document.getElementById('view-subtitle').textContent = meta.sub;
  document.getElementById('global-search').value = SEARCH[key] || '';
  document.getElementById('global-search').placeholder = 'Поиск: '+meta.title.toLowerCase()+'…';
  document.getElementById('view-port').scrollTop = 0;
  renderView(key);
}

/* global search wiring (per-view state) */
const SEARCH = {};
document.getElementById('global-search').addEventListener('input', debounce(e=>{
  SEARCH[currentView] = e.target.value.trim().toLowerCase();
  renderView(currentView);
}, 150));

function openModal(title, html){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-root').classList.add('open');
}
function closeModal(){ document.getElementById('modal-root').classList.remove('open'); }

function dl(rows){ // definition-list rows: [label, value-html]

}

let charts = {}; // Chart.js instances kept so we can destroy/recreate cleanly
function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }

function chartColors(){
  const cs = getComputedStyle(document.documentElement);
  return {
    text: cs.getPropertyValue('--text-dim').trim(),
    grid: cs.getPropertyValue('--border-soft').trim(),
    accent: cs.getPropertyValue('--accent').trim(),
    green: cs.getPropertyValue('--green').trim(),
    amber: cs.getPropertyValue('--amber').trim(),
    red: cs.getPropertyValue('--red').trim(),
  };
}

function renderGrowthChart(users){
  destroyChart('growth');
  const days = 30;
  const labels = [], counts = [];
  const now = new Date(); now.setHours(0,0,0,0);
  const buckets = {};
  for(let i=days-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    buckets[key]=0;
    labels.push(d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}));
  }
  users.forEach(u=>{
    const d = toDate(u.first_seen); if(!d) return;
    const key = d.toISOString().slice(0,10);
    if(key in buckets) buckets[key]++;
  });
  let running = 0;
  const cum = Object.keys(buckets).map(k=>{ running+=buckets[k]; return running; });
  const usersBefore = users.filter(u=>{ const d=toDate(u.first_seen); return d && d < new Date(Object.keys(buckets)[0]); }).length;
  const cumulative = cum.map(v=>v+usersBefore);
  const c = chartColors();
  const ctx = document.getElementById('chart-growth');
  charts.growth = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ data:cumulative, borderColor:c.accent, backgroundColor:'transparent', tension:.35, pointRadius:0, borderWidth:2 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> 'Всего: '+ctx.parsed.y } } },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:c.text, maxTicksLimit:6, font:{size:10.5} } },
        y:{ grid:{color:c.grid}, ticks:{ color:c.text, font:{size:10.5}, precision:0 }, beginAtZero:true }
      }
    }
  });
}
function renderStatusChart(listings){
  destroyChart('status');
  const c = chartColors();
  const pending = listings.filter(l=>l.status==='pending').length;
  const approved = listings.filter(l=> l.status==='approved' || (l.active && !l.status)).length;
  const rejected = listings.filter(l=>l.status==='rejected').length;
  const ctx = document.getElementById('chart-status');
  charts.status = new Chart(ctx, {
    type:'doughnut',
    data:{ labels:['Опубликовано','На модерации','Отклонено'], datasets:[{ data:[approved,pending,rejected], backgroundColor:[c.green,c.amber,c.red], borderWidth:0 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins:{ legend:{ position:'bottom', labels:{ color:c.text, boxWidth:9, boxHeight:9, font:{size:11.5}, padding:14 } } }
    }
  });
}
function renderCityRank(listings){
  const counts = {};
  listings.forEach(l=>{ const c=l.city||'—'; counts[c]=(counts[c]||0)+1; });
  const arr = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = arr.length ? arr[0][1] : 1;
  const el = document.getElementById('city-rank');
  if(!arr.length){ el.innerHTML = '<div class="empty-state">'+I('inbox')+'<div class="em-title">Пока нет объявлений</div></div>'; return; }
  el.innerHTML = '<div class="bar-rank">'+arr.map(([city,n])=>
    '<div class="bar-rank-row"><span class="rlabel">'+esc(city)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.round(n/max*100)+'%"></span></span><span class="rval">'+n+'</span></div>'
  ).join('')+'</div>';
}
function renderActivityFeed(users, listings, reviews){
  const items = [];
  users.forEach(u=>{ if(toDate(u.first_seen)) items.push({t:toDate(u.first_seen), type:'user', d:u}); });
  listings.forEach(l=>{ if(toDate(l.created_at)) items.push({t:toDate(l.created_at), type:'listing', d:l}); });
  reviews.forEach(r=>{ if(toDate(r.created_at)) items.push({t:toDate(r.created_at), type:'review', d:r}); });
  items.sort((a,b)=>b.t-a.t);
  const top = items.slice(0,9);
  const el = document.getElementById('activity-feed');
  if(!top.length){ el.innerHTML = '<div class="empty-state">'+I('inbox')+'<div class="em-title">Пока нет активности</div></div>'; return; }
  el.innerHTML = top.map(it=>{
    let icon, title;
    if(it.type==='user'){ icon=I('users'); title = '<b>'+esc(it.d.name||'Пользователь')+'</b> запустил бота'; }
    else if(it.type==='listing'){ icon=I('home'); title = 'Новое объявление в <b>'+esc(it.d.city||'—')+'</b> за '+money(it.d.price); }
    else { icon=I('star'); title = '<b>'+esc(it.d.name||'Пользователь')+'</b> оставил отзыв'; }
    return '<div class="tl-item"><div class="tl-dot">'+icon+'</div><div class="tl-body"><div class="tl-title">'+title+'</div><div class="tl-time">'+timeAgo(it.t)+'</div></div></div>';
  }).join('');
}

========================================================================================= */
const usersState = { sortKey:'first_seen', sortDir:-1, country:'', lang:'' };
function renderUsers(){
  const el = document.getElementById('view-users');
  const q = SEARCH.users || '';
  let rows = STORE.users.slice();
  if(LOAD.users==='loading' && !rows.length){ el.innerHTML = panelLoading(); return; }

  const countries = [...new Set(STORE.users.map(u=>u.country).filter(Boolean))].sort();

  if(q) rows = rows.filter(u => matches(u.name,q)||matches(u.username,q)||matches(u.hometown_city,q)||matches(u.university,q)||matches(u.id,q));
  if(usersState.country) rows = rows.filter(u=>u.country===usersState.country);
  if(usersState.lang) rows = rows.filter(u=>(u.language||'ru')===usersState.lang);
  rows.sort((a,b)=>{
    const k = usersState.sortKey;
    let va=a[k], vb=b[k];
    if(k==='first_seen'||k==='last_seen'){ va=toDate(va)?toDate(va).getTime():0; vb=toDate(vb)?toDate(vb).getTime():0; }
    else { va=(va||'').toString().toLowerCase(); vb=(vb||'').toString().toLowerCase(); }
    return va<vb ? -usersState.sortDir : va>vb ? usersState.sortDir : 0;
  });

  el.innerHTML = `
    <div class="toolbar">
      <select class="field" id="f-country"><option value="">Все страны</option>${countries.map(c=>`<option value="${esc(c)}" ${usersState.country===c?'selected':''}>${esc(countryLabel(c))}</option>`).join('')}</select>
      <select class="field" id="f-lang"><option value="">Любой язык</option><option value="ru" ${usersState.lang==='ru'?'selected':''}>Русский</option><option value="en" ${usersState.lang==='en'?'selected':''}>English</option></select>
      <span class="spacer"></span>
      <span class="hint" style="color:var(--text-faint);font-size:12px;">${rows.length} из ${STORE.users.length}</span>
      <button class="btn" id="btn-export-users">${I('dl')} Экспорт CSV</button>
    </div>
    <div class="panel table-scroll">${usersTableHtml(rows)}</div>
  `;
  document.getElementById('f-country').addEventListener('change', e=>{ usersState.country=e.target.value; renderUsers(); });
  document.getElementById('f-lang').addEventListener('change', e=>{ usersState.lang=e.target.value; renderUsers(); });
  document.getElementById('btn-export-users').addEventListener('click', ()=>{
    downloadCSV('users.csv', ['id','name','username','language','country','city','university','profile_completed','first_seen','last_seen'],
      rows.map(u=>[u.id,u.name||'',u.username||'',u.language||'',u.country||'',u.hometown_city||'',u.university||'',u.profile_completed?1:0, fmtDateTime(u.first_seen), fmtDateTime(u.last_seen)]));
  });
  el.querySelectorAll('th.sortable').forEach(th=> th.addEventListener('click', ()=>{
    const k = th.dataset.key;
    usersState.sortDir = (usersState.sortKey===k) ? -usersState.sortDir : -1;
    usersState.sortKey = k; renderUsers();
  }));
  el.querySelectorAll('tbody tr').forEach(tr=> tr.addEventListener('click', ()=> openUserModal(tr.dataset.id)));
}
function sortArrow(key,state){ return state.sortKey===key ? '<span class="arrow">'+(state.sortDir===1?'▲':'▼')+'</span>' : ''; }
function usersTableHtml(rows){
  if(!rows.length) return emptyState('users','Пользователи не найдены','Измените фильтры поиска, чтобы увидеть больше результатов.');
  return `<table class="data-table"><thead><tr>
    <th>Пользователь</th>
    <th class="sortable" data-key="country">Страна / город ${sortArrow('country',usersState)}</th>
    <th class="sortable" data-key="university">Университет ${sortArrow('university',usersState)}</th>
    <th>Язык</th>
    <th class="sortable" data-key="first_seen">Регистрация ${sortArrow('first_seen',usersState)}</th>
    <th class="sortable" data-key="last_seen">Активность ${sortArrow('last_seen',usersState)}</th>
    <th>Объявл.</th>
  </tr></thead><tbody>
  ${rows.map(u=>{
    const cnt = listingsByOwner(u.id).length;
    return `<tr data-id="${esc(u.id)}">
      <td class="cell-name"><div class="name-cell"><div class="avatar">${initials(u.name)}</div><div class="n-meta"><div class="n-name">${esc(u.name||'—')}</div><div class="n-sub">${u.username?('@'+esc(u.username)):('ID '+esc(u.id))}</div></div></div></td>
      <td data-label="Страна">${esc(countryLabel(u.country))}${u.hometown_city?('<div class="td-dim" style="font-size:11px;">'+esc(u.hometown_city)+'</div>'):''}</td>
      <td data-label="Университет" class="td-dim">${esc(u.university||'—')}</td>
      <td data-label="Язык">${u.language==='en'?'🇬🇧 EN':'🇷🇺 RU'}</td>
      <td data-label="Регистрация" class="mono-sm">${fmtDateShort(u.first_seen)}</td>
      <td data-label="Активность" class="td-dim">${timeAgo(u.last_seen)}</td>
      <td data-label="Объявлений">${cnt || '—'}</td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}

========================================================================================= */
const listingsState = { status:'', city:'', room:'', gender:'', sort:'new' };
function renderListings(){
  const el = document.getElementById('view-listings');
  const q = SEARCH.listings || '';
  let rows = STORE.listings.slice();
  if(LOAD.listings==='loading' && !rows.length){ el.innerHTML = panelLoading(); return; }

  const cities = [...new Set(STORE.listings.map(l=>l.city).filter(Boolean))].sort();

  if(q) rows = rows.filter(l=> matches(l.city,q)||matches(l.address,q)||matches(l.description,q)||matches(l.housing_type,q));
  if(listingsState.status) rows = rows.filter(l=> listingsState.status==='approved' ? (l.status==='approved'||(l.active&&!l.status)) : l.status===listingsState.status);
  if(listingsState.city) rows = rows.filter(l=>l.city===listingsState.city);
  if(listingsState.room) rows = rows.filter(l=>l.room===listingsState.room);
  if(listingsState.gender) rows = rows.filter(l=>l.gender===listingsState.gender);
  rows.sort((a,b)=>{
    if(listingsState.sort==='price_asc') return (a.price||0)-(b.price||0);
    if(listingsState.sort==='price_desc') return (b.price||0)-(a.price||0);
    return (toDate(b.created_at)||0)-(toDate(a.created_at)||0);
  });

  el.innerHTML = `
    <div class="toolbar">
      <select class="field" id="f-status"><option value="">Любой статус</option>
        <option value="pending" ${listingsState.status==='pending'?'selected':''}>На модерации</option>
        <option value="approved" ${listingsState.status==='approved'?'selected':''}>Опубликовано</option>
        <option value="rejected" ${listingsState.status==='rejected'?'selected':''}>Отклонено</option>
      </select>
      <select class="field" id="f-city"><option value="">Все города</option>${cities.map(c=>`<option value="${esc(c)}" ${listingsState.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select class="field" id="f-room"><option value="">Любое жильё</option>${Object.entries(ROOM_LABELS).map(([k,v])=>`<option value="${k}" ${listingsState.room===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="field" id="f-gender"><option value="">Все аудитории</option>${Object.entries(GENDER_LABELS).map(([k,v])=>`<option value="${k}" ${listingsState.gender===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="field" id="f-sort">
        <option value="new" ${listingsState.sort==='new'?'selected':''}>Сначала новые</option>
        <option value="price_asc" ${listingsState.sort==='price_asc'?'selected':''}>Дешевле сначала</option>
        <option value="price_desc" ${listingsState.sort==='price_desc'?'selected':''}>Дороже сначала</option>
      </select>
      <span class="spacer"></span>
      <span class="hint" style="color:var(--text-faint);font-size:12px;">${rows.length} из ${STORE.listings.length}</span>
      <button class="btn" id="btn-export-listings">${I('dl')} Экспорт CSV</button>
    </div>
    ${rows.length ? '<div class="card-grid">'+rows.map(listingCardHtml).join('')+'</div>' : emptyState('listings','Объявления не найдены','Попробуйте сбросить фильтры или изменить запрос.')}
  `;
  ['status','city','room','gender','sort'].forEach(k=>{
    document.getElementById('f-'+k).addEventListener('change', e=>{ listingsState[k]=e.target.value; renderListings(); });
  });
  document.getElementById('btn-export-listings').addEventListener('click', ()=>{
    downloadCSV('listings.csv', ['id','city','housing_type','room','price','price_type','deposit','status','active','address','owner_id','created_at'],
      rows.map(l=>[l.id,l.city||'',l.housing_type||'',l.room||'',l.price||0,l.price_type||'',l.deposit||0,l.status||'',l.active?1:0,l.address||'',l.owner_id||'',fmtDateTime(l.created_at)]));
  });
  el.querySelectorAll('.lst-card').forEach(card=> card.addEventListener('click', ()=> openListingModal(card.dataset.id)));
}
function listingCardHtml(l){
  const photo = firstPhoto(l);
  const photos = allPhotos(l);
  return `<div class="lst-card" data-id="${esc(l.id)}">
    <div class="lst-thumb">
      ${photo ? `<img src="${esc(photo)}" loading="lazy">` : `<div class="no-photo">${I('camera')} нет фото</div>`}
      <div class="lst-badge-row">${statusBadge(l.status,l.active)}</div>
      ${photos.length>1?`<span class="ph-count">${I('camera')} ${photos.length}</span>`:''}
    </div>
    <div class="lst-body">
      <div class="lst-price">${money(l.price)}<span style="font-size:11px;color:var(--text-faint);font-family:var(--sans);"> ${priceTypeLabel(l.price_type)}</span></div>
      <div class="lst-title">${esc(l.city||'—')} · ${roomLabel(l.room)}</div>
      <div class="lst-meta"><span>${genderLabel(l.gender)}</span><span>${timeAgo(l.created_at)}</span></div>
    </div>
  </div>`;
}

/* =========================================================================================
   RENDER: FRIENDS ("Люди")
========================================================================================= */
const friendsState = { activeOnly:false };
function renderFriends(){
  const el = document.getElementById('view-friends');
  const q = SEARCH.friends || '';
  let rows = STORE.friends.slice();
  if(LOAD.friends==='loading' && !rows.length){ el.innerHTML = panelLoading(); return; }
  if(q) rows = rows.filter(f=> matches(f.name,q)||matches(f.username,q)||matches(f.university,q)||matches(f.hometown_city,q));
  if(friendsState.activeOnly) rows = rows.filter(f=>f.active);
  rows.sort((a,b)=>(toDate(b.friend_updated_at)||0)-(toDate(a.friend_updated_at)||0));

  el.innerHTML = `
    <div class="toolbar">
      <div class="chip-toggle">
        <button class="${!friendsState.activeOnly?'active':''}" data-v="0">Все</button>
        <button class="${friendsState.activeOnly?'active':''}" data-v="1">Только активные</button>
      </div>
      <span class="spacer"></span>
      <span class="hint" style="color:var(--text-faint);font-size:12px;">${rows.length} из ${STORE.friends.length}</span>
    </div>
    ${rows.length ? '<div class="card-grid">'+rows.map(friendCardHtml).join('')+'</div>' : emptyState('people','Анкет пока нет','Пользователи публикуют анкету через раздел «Люди» в боте.')}
  `;
  el.querySelectorAll('.chip-toggle button').forEach(b=> b.addEventListener('click', ()=>{ friendsState.activeOnly = b.dataset.v==='1'; renderFriends(); }));
  el.querySelectorAll('.friend-card').forEach(c=> c.addEventListener('click', ()=> openFriendModal(c.dataset.id)));
}
function friendCardHtml(f){
  return `<div class="friend-card" data-id="${esc(f.id)}">
    <div class="friend-top">
      <div class="avatar">${f.friend_avatar_url?`<img src="${esc(f.friend_avatar_url)}">`:initials(f.name)}</div>
      <div><div class="friend-name">${esc(f.name||'—')}</div><div class="friend-sub">${countryLabel(f.country)} ${f.hometown_city?('· '+esc(f.hometown_city)):''}</div></div>
    </div>
    <div class="friend-bio">${esc(f.profile_description||'Без описания')}</div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
      <span class="td-dim" style="font-size:11px;">${esc(f.university||'—')}</span>
      ${boolBadge(!!f.active,'Активна','Скрыта')}
    </div>
  </div>`;
}

/* =========================================================================================
   RENDER: REVIEWS
========================================================================================= */
const reviewsState = { activeOnly:false };
function renderReviews(){
  const el = document.getElementById('view-reviews');
  const q = SEARCH.reviews || '';
  let rows = STORE.reviews.slice();
  if(LOAD.reviews==='loading' && !rows.length){ el.innerHTML = panelLoading(); return; }
  if(q) rows = rows.filter(r=> matches(r.name,q)||matches(r.username,q)||matches(r.text,q));
  if(reviewsState.activeOnly) rows = rows.filter(r=>r.active);

  el.innerHTML = `
    <div class="toolbar">
      <div class="chip-toggle">
        <button class="${!reviewsState.activeOnly?'active':''}" data-v="0">Все</button>
        <button class="${reviewsState.activeOnly?'active':''}" data-v="1">Только активные</button>
      </div>
      <span class="spacer"></span>
      <span class="hint" style="color:var(--text-faint);font-size:12px;">${rows.length} из ${STORE.reviews.length}</span>
    </div>
    <div class="panel pad">${rows.length ? rows.map(reviewItemHtml).join('') : emptyState('star','Отзывов пока нет','Они появятся здесь сразу после публикации в боте.')}</div>
  `;
  el.querySelectorAll('.chip-toggle button').forEach(b=> b.addEventListener('click', ()=>{ reviewsState.activeOnly = b.dataset.v==='1'; renderReviews(); }));
}
function reviewItemHtml(r){
  return `<div class="review-item">
    <div class="avatar">${r.avatar_url?`<img src="${esc(r.avatar_url)}">`:initials(r.name)}</div>
    <div class="review-body">
      <div class="review-head">
        <span class="td-strong">${esc(r.name||'—')}</span>
        ${r.username?`<span class="td-dim" style="font-size:11.5px;">@${esc(r.username)}</span>`:''}
        ${boolBadge(!!r.active,'Активен','Скрыт')}
        <span class="td-dim" style="font-size:11px;margin-left:auto;">${timeAgo(r.created_at)}</span>
      </div>
      <div class="review-text">${esc(r.text||'')}</div>
    </div>
  </div>`;
}

/* =========================================================================================
   RENDER: SUBSCRIPTIONS
========================================================================================= */
const subsState = { activeOnly:false, city:'' };
function renderSubs(){
  const el = document.getElementById('view-subs');
  const q = SEARCH.subs || '';
  let rows = STORE.subs.slice();
  if(LOAD.subs==='loading' && !rows.length){ el.innerHTML = panelLoading(); return; }
  const cities = [...new Set(STORE.subs.map(s=>s.city).filter(Boolean))].sort();
  if(q) rows = rows.filter(s=> matches(s.city,q)||matches(s.user_id,q));
  if(subsState.activeOnly) rows = rows.filter(s=>s.active);
  if(subsState.city) rows = rows.filter(s=>s.city===subsState.city);

  el.innerHTML = `
    <div class="toolbar">
      <select class="field" id="f-sub-city"><option value="">Все города</option>${cities.map(c=>`<option value="${esc(c)}" ${subsState.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <div class="chip-toggle">
        <button class="${!subsState.activeOnly?'active':''}" data-v="0">Все</button>
        <button class="${subsState.activeOnly?'active':''}" data-v="1">Только активные</button>
      </div>
      <span class="spacer"></span>
      <span class="hint" style="color:var(--text-faint);font-size:12px;">${rows.length} из ${STORE.subs.length}</span>
    </div>
    <div class="panel table-scroll">${subsTableHtml(rows)}</div>
  `;
  document.getElementById('f-sub-city').addEventListener('change', e=>{ subsState.city=e.target.value; renderSubs(); });
  el.querySelectorAll('.chip-toggle button').forEach(b=> b.addEventListener('click', ()=>{ subsState.activeOnly = b.dataset.v==='1'; renderSubs(); }));
  el.querySelectorAll('tbody tr').forEach(tr=> tr.addEventListener('click', ()=> openUserModal(tr.dataset.uid)));
}
function subsTableHtml(rows){
  if(!rows.length) return emptyState('bell','Подписок пока нет','Пользователи сохраняют поиск, когда не находят подходящее жильё.');
  return `<table class="data-table"><thead><tr><th>Пользователь</th><th>Город</th><th>Жильё</th><th>Бюджет до</th><th>Статус</th><th>Создана</th></tr></thead><tbody>
  ${rows.map(s=>{
    const u = userById(s.user_id);
    return `<tr data-uid="${esc(s.user_id)}">
      <td data-label="Пользователь">${u? esc(u.name||u.id) : ('ID '+esc(s.user_id))}</td>
      <td data-label="Город">${esc(s.city||'—')}</td>
      <td data-label="Жильё">${roomLabel(s.room)}</td>
      <td data-label="Бюджет">${s.price_max>=NO_LIMIT?'без лимита':money(s.price_max)}</td>
      <td data-label="Статус">${boolBadge(!!s.active,'Активна','Отписан')}</td>
      <td data-label="Создана" class="mono-sm">${fmtDateShort(s.created_at)}</td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

/* =========================================================================================
   RENDER: CONFIG
========================================================================================= */
function renderConfig(){
  const el = document.getElementById('view-config');
  const cfg = STORE.config;
  el.innerHTML = `
    <div class="panel pad" style="max-width:560px;">
      <div class="section-head"><h2>config / main</h2><span class="hint">только чтение</span></div>
      ${cfg ? dl(Object.entries(cfg).map(([k,v])=>[esc(k), '<span class="mono-sm">'+esc(typeof v==='object'?JSON.stringify(v):v)+'</span>'])) :
        (LOAD.config==='loading' ? panelLoading() : emptyState('sliders','Документ не найден','config/main ещё не создан ботом.'))}
    </div>
    <div style="margin-top:16px;color:var(--text-faint);font-size:11.5px;">Этот раздел отражает документ <span class="mono-sm">config/main</span> из Firestore — например, ID чата модерации. Изменение значений через эту CRM невозможно.</div>
  `;
}

/* =========================================================================================
   SHARED EMPTY / LOADING STATES
========================================================================================= */
function panelLoading(){ return '<div class="panel"><div class="loading-row">Загрузка данных из Firestore…</div></div>'; }
function emptyState(icon, title, sub){
  return `<div class="panel"><div class="empty-state">${I(icon)}<div class="em-title">${esc(title)}</div><div>${esc(sub)}</div></div></div>`;
}

/* =========================================================================================
   MASTER RENDER DISPATCH
========================================================================================= */
function renderView(key){
  if(key==='dashboard') renderDashboard();
  else if(key==='users') renderUsers();
  else if(key==='listings') renderListings();
  else if(key==='friends') renderFriends();
  else if(key==='reviews') renderReviews();
  else if(key==='subs') renderSubs();
  else if(key==='config') renderConfig();
  buildNav(); // keep counts fresh
  document.querySelectorAll('#primary-nav .nav-item').forEach(el=> el.classList.toggle('active', el.dataset.key===currentView));
  document.querySelectorAll('#mobile-nav .mnav-item[data-key]').forEach(el=> el.classList.toggle('active', el.dataset.key===currentView));
}
function renderAll(){ renderView(currentView); }

/* =========================================================================================
   THEME TOGGLE
========================================================================================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-toggle').innerHTML = t==='light' ? I('moon') : I('sun');
  localStorage.setItem('ih_crm_theme', t);
  destroyChart('growth'); destroyChart('status');
  setTimeout(()=> renderView(currentView), 0);
}
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
  applyTheme(cur);
});
applyTheme(localStorage.getItem('ih_crm_theme') || 'dark');

/* =========================================================================================
   BOOT
========================================================================================= */
buildNav();
showView('dashboard');
setTimeout(checkFirstLoad, 6000); // safety: hide splash even if some collection never resolves
</script>
</body>

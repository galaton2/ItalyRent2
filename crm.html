<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italy Housing — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#EEF1F5;--panel:#fff;--ink:#14202E;--dim:#5A6778;--line:#D8DEE7;--acc:#0C6F7A;--acc-ink:#fff;--bad:#BC3A2E;--bad-bg:#FBEAE8;--ok:#2F7D4F;--ok-bg:#E5F3EA;--warn:#9A6A12;--warn-bg:#FBF1DA;--off:#5A6778;--off-bg:#E8ECF1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F151D;--panel:#161E29;--ink:#E6EBF2;--dim:#93A0B2;--line:#263243;--acc:#4FC1CC;--acc-ink:#06262A;--bad:#F0786C;--bad-bg:#3A1D1B;--ok:#6CCB8E;--ok-bg:#17301F;--warn:#E3B35A;--warn-bg:#35290F;--off:#93A0B2;--off-bg:#212B3A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.d{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
button.g{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],input[type=password],input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.hide{display:none!important}
#login{min-height:100%;display:grid;place-items:center;padding:20px}
#login form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
#login h1{margin:0;font-size:20px}
#err{color:var(--bad);min-height:1.3em;margin:0}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav h1{font-size:16px;margin:0 8px 14px}
nav button{display:flex;justify-content:space-between;border:0;background:none;text-align:left;padding:9px 10px}
nav button.on{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
nav .n{color:var(--dim);font-variant-numeric:tabular-nums}
nav .sp{flex:1}
main{padding:20px;min-width:0;padding-bottom:90px}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tool h2{margin:0 auto 0 0;font-size:20px}
.tool input{width:260px}.tool select{width:auto}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--dim);font-size:13px;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
td small{display:block;color:var(--dim)}
td.t{max-width:340px}
.th{width:48px;height:36px;object-fit:cover;border-radius:6px;background:var(--off-bg);display:block}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--ok)}.b.warn{background:var(--warn-bg);color:var(--warn)}.b.off{background:var(--off-bg);color:var(--off)}
.empty{padding:40px;text-align:center;color:var(--dim)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:5}
#bar button{padding:6px 12px}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto;z-index:6;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
#dr h3{margin:0 40px 12px 0;font-size:17px}
#dr .x{position:absolute;top:14px;right:14px}
#dr .ph{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}#dr .ph img{height:96px;border-radius:8px}
#dr dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0 0 16px}
#dr dt{color:var(--dim)}#dr dd{margin:0;word-break:break-word}
#dr .acts{display:flex;gap:8px;flex-wrap:wrap}
dialog{border:1px solid var(--bad);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(440px,calc(100% - 24px))}
dialog::backdrop{background:rgba(8,12,18,.6)}
dialog h2{margin:0 0 8px;font-size:18px;color:var(--bad)}
dialog p{margin:0 0 12px;color:var(--dim)}
dialog label{display:flex;gap:8px;align-items:center;margin:8px 0}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20}
@media (max-width:820px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav h1,nav .sp{display:none}nav button{white-space:nowrap;gap:8px}nav button.on{box-shadow:inset 0 -3px 0 var(--acc)}main{padding:12px;padding-bottom:90px}.tool input{width:100%}#dr dl{grid-template-columns:100px 1fr}}
@media (prefers-reduced-motion:no-preference){#dr{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}}}
</style>
</head>
<body>
<div id="login" class="hide">
  <form id="lf">
    <h1>Italy Housing — CRM</h1>
    <input type="text" id="em_in" placeholder="Email администратора" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Пароль администратора" autocomplete="current-password" required>
    <p id="err"></p>
    <button class="p">Войти</button>
  </form>
</div>

<div id="app" class="hide">
  <nav id="nav"></nav>
  <main>
    <div class="tool">
      <h2 id="ttl"></h2>
      <select id="flt"></select>
      <input type="search" id="q" placeholder="Поиск по любому полю">
      <button id="rf">Обновить</button>
    </div>
    <div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table><div id="em" class="empty hide">Ничего не найдено</div></div>
  </main>
</div>

<div id="bar" class="hide"><span id="cnt"></span><button id="clr">Снять выбор</button><button class="d" id="bd">Удалить</button></div>
<aside id="dr" class="hide"></aside>
<dialog id="cf"></dialog>
<div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['listings','Объявления'],['users','Пользователи'],['friend_profiles','Анкеты «Люди»'],['reviews','Отзывы'],['subscriptions','Подписки']];
let D={},tab='listings',flt='all',q='',sel=new Set(),view=[],busy=false;

const fmt=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('ru-RU',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})};
const tag=(t,c)=>`<span class="b ${c}">${t}</span>`;
const lst=r=>r.status==='pending'?tag('На модерации','warn'):r.active?tag('Опубликовано','ok'):tag('Скрыто','off');
const act=r=>r.active===false?tag('Скрыто','off'):tag('Активно','ok');
const two=(a,b)=>`${esc(a??'—')}<small>${esc(b??'')}</small>`;
const un=r=>r.username?'@'+r.username:'—';
const cut=(s,n=90)=>{s=String(s??'');return esc(s.length>n?s.slice(0,n)+'…':s)};
const ownerCount=id=>D.listings.filter(l=>String(l.owner_id)===String(id)).length;
const userName=id=>{const u=D.users.find(x=>String(x.id)===String(id));return u?u.name:''};

const COLS={
 listings:[['',r=>r.photo_urls?.[0]?`<img class="th" loading="lazy" referrerpolicy="no-referrer" src="${esc(r.photo_urls[0])}" alt="">`:'<span class="th"></span>'],
  ['Жильё',r=>two(r.city,`${r.housing_type||''}, ${r.room||''}`)],['Цена',r=>`€${esc(r.price??0)}`],['Статус',lst],
  ['Адрес',r=>`<span class="t">${cut(r.address,60)}</span>`],['Автор',r=>two(un(r),r.owner_id)],['Создано',r=>fmt(r.created_at)]],
 users:[['Имя',r=>two(r.name,un(r))],['Откуда',r=>two(r.country,r.hometown_city)],['Университет',r=>esc(r.university||'—')],
  ['Язык',r=>esc(r.language||'—')],['Объявлений',r=>ownerCount(r.id)],['Последний вход',r=>fmt(r.last_seen)]],
 friend_profiles:[['Имя',r=>two(r.name,un(r))],['Откуда',r=>two(r.country,r.hometown_city)],['Университет',r=>esc(r.university||'—')],
  ['Описание',r=>`<span class="t">${cut(r.profile_description)}</span>`],['Статус',act],['Обновлено',r=>fmt(r.friend_updated_at)]],
 reviews:[['Автор',r=>two(r.name,un(r))],['Отзыв',r=>`<span class="t">${cut(r.text,140)}</span>`],['Статус',act],['Создан',r=>fmt(r.created_at)]],
 subscriptions:[['Пользователь',r=>two(userName(r.user_id)||'—',r.user_id)],['Город',r=>esc(r.city)],['Тип',r=>esc(r.room)],
  ['Цена до',r=>r.price_max>=1e9?'без лимита':'€'+esc(r.price_max)],['Статус',act],['Создана',r=>fmt(r.created_at)]]
};
const FLT={listings:[['all','Все'],['pending','На модерации'],['live','Опубликовано'],['hidden','Скрыто']],users:[['all','Все']]};
const FLT_DEF=[['all','Все'],['live','Активные'],['hidden','Скрытые']];
const match=r=>{if(flt==='all')return true;
 if(tab==='listings'){const p=r.status==='pending';return flt==='pending'?p:flt==='live'?(r.active&&!p):(!r.active&&!p)}
 return flt==='live'?r.active!==false:r.active===false};
const stamp=r=>r.created_at||r.first_seen||r.friend_updated_at||'';

firebase.initializeApp({apiKey:"AIzaSyAMQiC3mT8TmnpeU34piR4Vugq3QT4X_So",authDomain:"italy-rent.firebaseapp.com",projectId:"italy-rent",storageBucket:"italy-rent.firebasestorage.app",messagingSenderId:"712654556706",appId:"1:712654556706:web:6a1bf74096c5110129847b"});
const fdb=firebase.firestore(),auth=firebase.auth();
const COLNAMES=['listings','users','friend_profiles','reviews','subscriptions'];
const plain=v=>{if(v&&typeof v.toDate==='function')return v.toDate().toISOString();if(Array.isArray(v))return v.map(plain);
  if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,plain(x)]));return v};
const ids_of=async(col,f,id)=>(await fdb.collection(col).where(f,'==',Number(id)).get()).docs;
async function delUser(id,stats){
  for(const [col,f] of [['listings','owner_id'],['reviews','user_id'],['subscriptions','user_id']])
    for(const d of /^\d+$/.test(id)?await ids_of(col,f,id):[]){await d.ref.delete();stats[col]=(stats[col]||0)+1}
  await fdb.collection('friend_profiles').doc(id).delete();await fdb.collection('users').doc(id).delete();
}
async function api(path,b){
  try{
    if(path==='/api/login'){await auth.signInWithEmailAndPassword(b.email,b.password);return{}}
    if(path==='/api/logout'){await auth.signOut();return{}}
    if(!auth.currentUser)throw{code:'auth'};
    if(path==='/api/data'){const r=await Promise.all(COLNAMES.map(c=>fdb.collection(c).get()));
      return Object.fromEntries(COLNAMES.map((c,i)=>[c,r[i].docs.map(d=>({_id:d.id,...plain(d.data())}))]))}
    if(path==='/api/delete'){let n=0;const also={};
      for(const id of b.ids){if(b.collection==='users'&&b.cascade)await delUser(id,also);else await fdb.collection(b.collection).doc(id).delete();n++}
      return{deleted:n,also}}
    if(path==='/api/active'){const p={active:b.active};if(b.collection==='listings'&&b.active)p.status='approved';
      for(const id of b.ids)await fdb.collection(b.collection).doc(id).update(p);return{updated:b.ids.length}}
  }catch(e){
    if(e.code==='auth'){showLogin();throw new Error('auth')}
    const m={'permission-denied':'Нет доступа: UID админа не прописан в firestore.rules или правила не опубликованы.',
      'auth/invalid-credential':'Неверный email или пароль','auth/invalid-login-credentials':'Неверный email или пароль',
      'auth/too-many-requests':'Слишком много попыток, подождите несколько минут','auth/invalid-email':'Некорректный email'};
    throw new Error(m[e.code]||e.message)}
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3200)}
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').focus()}

async function load(){
  try{D=await api('/api/data');$('#login').classList.add('hide');$('#app').classList.remove('hide');renderNav();render()}
  catch(e){if(e.message!=='auth')toast(e.message)}
}
function renderNav(){
  $('#nav').innerHTML='<h1>Italy Housing</h1>'+TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}<span class="n">${D[k].length}</span></button>`).join('')+'<span class="sp"></span><button id="lo">Выйти</button>';
}
function render(){
  $('#ttl').textContent=TABS.find(t=>t[0]===tab)[1];
  const opts=FLT[tab]||FLT_DEF;
  $('#flt').innerHTML=opts.map(([k,n])=>`<option value="${k}">${n}</option>`).join('');$('#flt').value=flt;
  $('#flt').classList.toggle('hide',opts.length<2);
  const s=q.trim().toLowerCase();
  view=D[tab].filter(match).filter(r=>!s||JSON.stringify(r).toLowerCase().includes(s)).sort((a,b)=>String(stamp(b)).localeCompare(String(stamp(a))));
  const cols=COLS[tab];
  $('#th').innerHTML='<tr><th><input type="checkbox" id="all" aria-label="Выбрать все"></th>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';
  $('#tb').innerHTML=view.map(r=>`<tr data-id="${esc(r._id)}"><td><input type="checkbox" class="ck" ${sel.has(r._id)?'checked':''} aria-label="Выбрать"></td>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('');
  $('#em').classList.toggle('hide',view.length>0);bar();
}
function bar(){
  const n=[...sel].filter(id=>D[tab].some(r=>r._id===id)).length;
  $('#bar').classList.toggle('hide',!n);$('#cnt').textContent='Выбрано: '+n;
  const a=$('#all');if(a){const v=view.filter(r=>sel.has(r._id)).length;a.checked=v>0&&v===view.length;a.indeterminate=v>0&&v<view.length}
}
function detail(id){
  const r=D[tab].find(x=>x._id===id);if(!r)return;
  const skip=['_id','photo_urls','photos','photo_file_ids'];
  const rows=Object.entries(r).filter(([k])=>!skip.includes(k)).sort().map(([k,v])=>{
    const val=typeof v==='object'&&v!==null?JSON.stringify(v):v;
    const shown=/_at$|^last_seen$|^first_seen$/.test(k)?fmt(v):esc(val);
    return `<dt>${esc(k)}</dt><dd>${shown}</dd>`}).join('');
  const ph=(r.photo_urls||[]).map(u=>`<img referrerpolicy="no-referrer" src="${esc(u)}" alt="">`).join('');
  const t=r.city?`${r.city}, ${r.address||''}`:(r.name||r.text||r._id);
  const can=tab!=='users';
  $('#dr').innerHTML=`<button class="x" id="dx" aria-label="Закрыть">✕</button><h3>${cut(t,70)}</h3>${ph?`<div class="ph">${ph}</div>`:''}<dl>${rows}</dl>
  <div class="acts">${can&&r.active!==true?`<button class="p" data-a="on">${tab==='listings'?'Опубликовать':'Показать'}</button>`:''}${can&&r.active!==false&&r.active!==undefined?'<button data-a="off">Скрыть</button>':''}<button class="g" data-a="del">Удалить</button></div>`;
  $('#dr').dataset.id=id;$('#dr').classList.remove('hide');
}
function ask(ids){
  return new Promise(res=>{
    const n=ids.length,dlg=$('#cf');
    const info={listings:'Объявление пропадёт из бота и мини-приложения. Удаляется только запись в базе: сообщения в чате модерации и файлы фото остаются.',
      users:'Удалится профиль пользователя.',friend_profiles:'Анкета пропадёт из раздела «Люди».',reviews:'Отзыв пропадёт из мини-приложения.',subscriptions:'Подписка на поиск будет отменена.'}[tab];
    const lc=tab==='users'?ids.reduce((a,i)=>a+ownerCount(D.users.find(u=>u._id===i)?.id),0):0;
    dlg.innerHTML=`<h2>Удалить ${n>1?n+' записей':'запись'}?</h2><p>${info} Это нельзя отменить.</p>
    ${tab==='users'?`<label><input type="checkbox" id="cas" checked> Удалить всё: объявления (${lc}), анкету, отзывы, подписки</label>`:''}
    <div id="tw"></div><div class="row"><button id="no">Отмена</button><button class="d" id="yes">Удалить</button></div>`;
    const need=()=>n>1||(tab==='users'&&$('#cas').checked);
    const sync=()=>{const w=$('#tw');if(need()){if(!w.innerHTML)w.innerHTML='<p>Для подтверждения введите <b>УДАЛИТЬ</b></p><input type="text" id="tp" autocomplete="off">';
      $('#yes').disabled=($('#tp').value.trim().toUpperCase()!=='УДАЛИТЬ')}else{w.innerHTML='';$('#yes').disabled=false}};
    dlg.onchange=sync;dlg.oninput=sync;sync();
    let out=null;
    $('#no').onclick=()=>dlg.close();
    $('#yes').onclick=()=>{out={cascade:$('#cas')?.checked||false,notify:$('#nt')?.checked||false,reason:$('#rs')?.value||''};dlg.close()};
    dlg.onclose=()=>res(out);
    dlg.showModal();
  });
}
async function del(ids){
  const o=await ask(ids);if(!o||busy)return;busy=true;
  try{const r=await api('/api/delete',{collection:tab,ids,...o});
    const x=Object.entries(r.also||{}).map(([k,v])=>`${k}: ${v}`).join(', ');
    toast(`Удалено: ${r.deleted}${x?' (+ '+x+')':''}`);ids.forEach(i=>sel.delete(i));$('#dr').classList.add('hide');await load()}
  catch(e){toast(e.message)}finally{busy=false}
}
async function setActive(ids,on){
  try{await api('/api/active',{collection:tab,ids,active:on});toast(on?'Опубликовано':'Скрыто');$('#dr').classList.add('hide');await load()}
  catch(e){toast(e.message)}
}

$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
  try{await api('/api/login',{email:$('#em_in').value.trim(),password:$('#pw').value});$('#pw').value=''}catch(x){$('#err').textContent=x.message}};
$('#nav').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='lo'){await api('/api/logout',{});showLogin();return}
  tab=b.dataset.t;flt='all';q='';$('#q').value='';sel.clear();$('#dr').classList.add('hide');renderNav();render()};
$('#flt').onchange=e=>{flt=e.target.value;render()};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#rf').onclick=load;
$('#th').onchange=e=>{if(e.target.id!=='all')return;view.forEach(r=>e.target.checked?sel.add(r._id):sel.delete(r._id));
  document.querySelectorAll('.ck').forEach(c=>c.checked=e.target.checked);bar()};
$('#tb').onclick=e=>{
  const tr=e.target.closest('tr');if(!tr)return;
  if(e.target.classList.contains('ck')){e.target.checked?sel.add(tr.dataset.id):sel.delete(tr.dataset.id);bar();return}
  detail(tr.dataset.id)};
$('#clr').onclick=()=>{sel.clear();render()};
$('#bd').onclick=()=>del([...sel].filter(id=>D[tab].some(r=>r._id===id)));
$('#dr').onclick=e=>{
  const id=$('#dr').dataset.id;
  if(e.target.id==='dx')$('#dr').classList.add('hide');
  const a=e.target.dataset.a;if(!a)return;
  a==='del'?del([id]):setActive([id],a==='on')};

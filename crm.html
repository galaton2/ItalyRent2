<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italy Housing — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#EEF1F5;--pn:#fff;--ink:#14202E;--dim:#5A6778;--ln:#D8DEE7;--acc:#0C6F7A;--ai:#fff;--bad:#BC3A2E;--ok:#2F7D4F;--ok2:#E5F3EA;--wn:#9A6A12;--wn2:#FBF1DA;--of2:#E8ECF1;--bl:#2F6FB0;--vi:#7A5BB5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F151D;--pn:#161E29;--ink:#E6EBF2;--dim:#93A0B2;--ln:#263243;--acc:#4FC1CC;--ai:#06262A;--bad:#F0786C;--ok:#6CCB8E;--ok2:#17301F;--wn:#E3B35A;--wn2:#35290F;--of2:#212B3A;--bl:#6FA8E6;--vi:#B39BEA;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:var(--ai);border-color:var(--acc);font-weight:600}
button.d{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
button.g{color:var(--bad);border-color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{width:min(360px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:24px;display:grid;gap:12px}
#login h1{margin:0;font-size:20px}#err{color:var(--bad);min-height:1.3em;margin:0}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--pn);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
nav h1{font-size:16px;margin:0 8px 14px}
nav button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px}
nav button.on{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
nav .n{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}nav .sp{flex:1}
main{padding:20px;min-width:0;padding-bottom:100px}
.top{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}.top h2{margin:0;font-size:22px}.top span{color:var(--dim);margin-right:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips button{padding:6px 10px;border-radius:99px}
.chips button.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}
.fp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.fp label{display:grid;gap:4px;color:var(--dim);font-size:12px}.fp select,.fp input{width:100%;color:var(--ink);font-size:14px}
.fp .rs{align-self:end}
.wrap{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--ln)}
th{font-weight:600;color:var(--dim);font-size:13px;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}tbody tr:last-child td{border-bottom:0}
td small{display:block;color:var(--dim)}
.th{width:48px;height:36px;object-fit:cover;border-radius:6px;background:var(--of2);display:block}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok2);color:var(--ok)}.b.wn{background:var(--wn2);color:var(--wn)}.b.of{background:var(--of2);color:var(--dim)}
.empty{padding:40px;text-align:center;color:var(--dim)}
#more{display:block;margin:14px auto}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px}
.k span{color:var(--dim);font-size:13px}.k b{display:block;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}.k small{color:var(--dim)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;min-width:0}
.c.w{grid-column:1/-1}.c h3{margin:0 0 10px;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px}.bars i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-width:2px}
.ax{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px}
.hb{position:relative;display:flex;justify-content:space-between;gap:8px;padding:4px 8px;margin-bottom:3px;border-radius:6px;overflow:hidden}
.hb u{position:absolute;left:0;top:0;bottom:0;background:var(--acc);opacity:.16;z-index:0}.hb span,.hb b{position:relative;z-index:1}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day{margin:18px 0 6px;color:var(--dim);font-weight:600}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.ev:hover{border-color:var(--acc)}.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.dot.new{background:var(--ok)}.dot.start{background:var(--bl)}.dot.profile{background:var(--vi)}.dot.listing{background:var(--acc)}.dot.review{background:var(--wn)}.dot.sub{background:var(--dim)}
.ev div{flex:1;min-width:0}.ev small{display:block;color:var(--dim)}.ev time{color:var(--dim);font-size:12px;white-space:nowrap}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:5;white-space:nowrap}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--pn);border-left:1px solid var(--ln);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));overflow:auto;z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
#dr h3{margin:0 40px 12px 0;font-size:17px}#dr h4{margin:16px 0 6px}
#dr .x{position:absolute;top:14px;right:14px}
#dr .ph{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}#dr .ph img{height:96px;border-radius:8px}
#dr dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:0 0 16px}#dr dt{color:var(--dim)}#dr dd{margin:0;word-break:break-word}
#dr .acts{display:flex;gap:8px;flex-wrap:wrap}#dr .ev{cursor:default}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--pn);color:var(--ink);padding:22px;width:min(440px,calc(100% - 24px))}
dialog.dg{border-color:var(--bad)}dialog::backdrop{background:rgba(8,12,18,.6)}
dialog h2{margin:0 0 8px;font-size:18px}dialog.dg h2{color:var(--bad)}dialog p{margin:0 0 12px;color:var(--dim)}
dialog label{display:flex;gap:8px;align-items:center;margin:8px 0}dialog input[type=text]{width:100%}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:92%}
@media (max-width:820px){
#app{grid-template-columns:1fr}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:20;overflow-x:auto;gap:0}
nav h1,nav .sp,nav .n,nav #lo{display:none}
nav button{flex:1 0 auto;flex-direction:column;gap:0;font-size:11px;padding:6px 10px;text-align:center}nav button.on{box-shadow:inset 0 3px 0 var(--acc)}
nav .i{font-size:18px}
main{padding:12px;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
#bar{bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:94%}
.wrap{background:none;border:0}thead{display:none}table,tbody{display:block}
tbody tr{display:block;background:var(--pn);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;padding:8px 12px}
td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}
td::before{content:attr(data-l);color:var(--dim);text-align:left;flex:none}
td.ck0{justify-content:flex-start}td.ck0::before{content:none}td small{display:inline;margin-left:6px}
#dr dl{grid-template-columns:96px 1fr}}
@media (prefers-reduced-motion:no-preference){#dr{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}}}
</style>
</head>
<body>
<div id="login" class="hide"><form id="lf"><h1>Italy Housing — CRM</h1>
<input type="text" id="em_in" placeholder="Email администратора" autocomplete="username" required>
<input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required>
<p id="err"></p><button class="p">Войти</button></form></div>

<div id="app" class="hide">
<nav id="nav"></nav>
<main>
<div class="top"><h2 id="ttl"></h2><span id="upd"></span><button id="rf">Обновить</button></div>
<div class="tools">
<input type="search" id="q" placeholder="Поиск по любому полю">
<div class="chips" id="ch"></div>
<input type="date" id="d1" aria-label="С даты"><input type="date" id="d2" aria-label="По дату">
<select id="dfl" class="hide" aria-label="По какой дате"><option value="last_seen">Был(а) в боте</option><option value="first_seen">Регистрация</option></select>
<button id="fb">Фильтры</button><button id="cfg" class="hide">Настроить</button>
</div>
<div id="fp" class="fp hide"></div>
<section id="st" class="hide"></section>
<section id="ls" class="hide"><div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></section>
<section id="fd" class="hide"></section>
<div id="em" class="empty hide">Ничего не найдено. Измените поиск, даты или фильтры.</div>
<button id="more" class="hide">Показать ещё</button>
</main></div>

<div id="bar" class="hide"><span id="cnt"></span><button id="clr">Снять</button><button class="d" id="bd">Удалить</button></div>
<aside id="dr" class="hide"></aside>
<dialog id="cf"></dialog><dialog id="cw"></dialog>
<div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Firebase ---------- */
firebase.initializeApp({apiKey:"AIzaSyAMQiC3mT8TmnpeU34piR4Vugq3QT4X_So",authDomain:"italy-rent.firebaseapp.com",projectId:"italy-rent",storageBucket:"italy-rent.firebasestorage.app",messagingSenderId:"712654556706",appId:"1:712654556706:web:6a1bf74096c5110129847b"});
const fdb=firebase.firestore(),auth=firebase.auth();
const COLN=['listings','users','reviews','subscriptions'];
const plain=v=>{if(v&&typeof v.toDate==='function')return v.toDate().toISOString();if(Array.isArray(v))return v.map(plain);
 if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,plain(x)]));return v};
async function delUser(id,also){
 if(/^\d+$/.test(id))for(const [c,f] of [['listings','owner_id'],['reviews','user_id'],['subscriptions','user_id']])
  for(const d of (await fdb.collection(c).where(f,'==',Number(id)).get()).docs){await d.ref.delete();also[c]=(also[c]||0)+1}
 await fdb.collection('friend_profiles').doc(id).delete();await fdb.collection('users').doc(id).delete()}
async function api(path,b){
 try{
  if(path==='login'){await auth.signInWithEmailAndPassword(b.email,b.password);return{}}
  if(path==='logout'){await auth.signOut();return{}}
  if(!auth.currentUser)throw{code:'auth'};
  if(path==='data'){const r=await Promise.all(COLN.map(c=>fdb.collection(c).get()));
   return Object.fromEntries(COLN.map((c,i)=>[c,r[i].docs.map(d=>({_id:d.id,...plain(d.data())}))]))}
  if(path==='delete'){let n=0;const also={};
   for(const id of b.ids){if(b.col==='users'&&b.cascade)await delUser(id,also);else await fdb.collection(b.col).doc(id).delete();n++}
   return{deleted:n,also}}
  if(path==='active'){const p={active:b.on};if(b.col==='listings'&&b.on)p.status='approved';
   for(const id of b.ids)await fdb.collection(b.col).doc(id).update(p)}
 }catch(e){
  if(e.code==='auth'){showLogin();throw new Error('auth')}
  const m={'permission-denied':'Нет доступа: UID админа не прописан в firestore.rules или правила не опубликованы.','auth/invalid-credential':'Неверный email или пароль','auth/invalid-login-credentials':'Неверный email или пароль','auth/too-many-requests':'Слишком много попыток, подождите несколько минут','auth/invalid-email':'Некорректный email'};
  throw new Error(m[e.code]||e.message)}}

/* ---------- время ---------- */
const ms=v=>{const t=v?Date.parse(v):NaN;return isNaN(t)?0:t};
const p2=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const dstr=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const dtstr=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'только что':s<3600?Math.floor(s/60)+' мин назад':s<86400?Math.floor(s/3600)+' ч назад':s<604800?Math.floor(s/86400)+' дн назад':dstr(t)};
const dcell=t=>t?`${ago(t)}<small>${dtstr(t)}</small>`:'—';
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function dayHead(t){const d=sod(t),n=sod(Date.now());return d===n?'Сегодня':d===sod(n-36e5*12)?'Вчера':dstr(t)}

/* ---------- состояние ---------- */
let D={},EV=[],UM={},tab='stats',R={from:0,to:0,chip:'all'},q='',F={},df='last_seen',sel=new Set(),view=[],lim=100,busy=false;
const inR=t=>(!R.from&&!R.to)||(t&&(!R.from||t>=R.from)&&(!R.to||t<=R.to));
const TABS=[['stats','📊','Обзор'],['activity','⚡','Активность'],['listings','🏠','Объявления'],['users','👥','Люди'],['reviews','⭐','Отзывы'],['subscriptions','🔔','Подписки']];
const who=id=>{const u=UM[String(id)];return u?(u.name||'Без имени')+(u.username?' @'+u.username:''):'id '+id};
const ownerN=id=>D.listings.filter(l=>String(l.owner_id)===String(id)).length;
const stT=r=>r.status==='pending'?'На модерации':r.active?'Опубликовано':'Скрыто';
const tag=(t,c)=>`<span class="b ${c}">${t}</span>`;
const lst=r=>tag(stT(r),r.status==='pending'?'wn':r.active?'ok':'of');
const act=r=>r.active===false?tag('Скрыто','of'):tag('Активно','ok');
const two=(a,b)=>`${esc(a??'—')}${b?`<small>${esc(b)}</small>`:''}`;
const cut=(s,n=90)=>{s=String(s??'');return esc(s.length>n?s.slice(0,n)+'…':s)};
const un=r=>(r.username?'@'+r.username+', ':'')+'id '+r._id;

/* колонки: [заголовок, ячейка] */
const C={
 listings:[['',r=>r.photo_urls?.[0]?`<img class="th" loading="lazy" referrerpolicy="no-referrer" src="${esc(r.photo_urls[0])}" alt="">`:''],
  ['Жильё',r=>two(r.city,[r.housing_type,r.room].filter(Boolean).join(', '))],['Цена',r=>'€'+esc(r.price??0)],['Статус',lst],
  ['Адрес',r=>cut(r.address,60)],['Автор',r=>two(who(r.owner_id))],['Создано',r=>dcell(ms(r.created_at))]],
 users:[['Человек',r=>two(r.name||'Без имени',un(r))],['Университет',r=>esc(r.university||'—')],['Откуда',r=>two(r.country,r.hometown_city)],
  ['Язык',r=>esc(r.language||'—')],['Объявлений',r=>ownerN(r._id)],['Регистрация',r=>dcell(ms(r.first_seen))],['Был(а) в боте',r=>dcell(ms(r.last_seen))]],
 reviews:[['Автор',r=>two(r.name,r.username&&'@'+r.username)],['Отзыв',r=>cut(r.text,140)],['Статус',act],['Создан',r=>dcell(ms(r.created_at))]],
 subscriptions:[['Человек',r=>two(who(r.user_id))],['Город',r=>esc(r.city)],['Тип',r=>esc(r.room)],['Цена до',r=>r.price_max>=1e9?'без лимита':'€'+esc(r.price_max)],['Статус',act],['Создана',r=>dcell(ms(r.created_at))]]};
/* время строки и фасеты фильтров */
const TM={listings:r=>ms(r.created_at),users:r=>ms(r[df]),reviews:r=>ms(r.created_at),subscriptions:r=>ms(r.created_at),activity:e=>e.t};
const FA={
 listings:[['Статус',stT],['Город',r=>r.city],['Тип жилья',r=>r.housing_type],['Размещение',r=>r.room],['Контракт',r=>r.contract]],
 users:[['Университет',r=>r.university],['Страна',r=>r.country],['Родной город',r=>r.hometown_city],['Язык',r=>r.language],['Профиль',r=>r.profile_completed?'Заполнен':'Не заполнен'],['Объявления',r=>ownerN(r._id)?'Есть':'Нет']],
 reviews:[['Статус',r=>r.active===false?'Скрыто':'Активно']],
 subscriptions:[['Город',r=>r.city],['Тип',r=>r.room],['Статус',r=>r.active===false?'Скрыто':'Активно']],
 activity:[['Событие',e=>e.label]]};
const base=()=>tab==='activity'?EV:D[tab]||[];

/* ---------- события (лента) ---------- */
function buildEv(){
 UM={};D.users.forEach(u=>{UM[u._id]=u;if(u.id!=null)UM[String(u.id)]=u});EV=[];
 const add=(t,type,label,uid,col,id,txt,det)=>t&&EV.push({t,type,label,uid,col,id,txt,det});
 D.users.forEach(u=>{const f=ms(u.first_seen),l=ms(u.last_seen);
  add(f,'new','Новый пользователь',u._id,'users',u._id,'впервые запустил бота');
  if(l-f>6e4)add(l,'start','/start',u._id,'users',u._id,'снова нажал /start');
  add(ms(u.updated_at),'profile','Профиль',u._id,'users',u._id,'сохранил профиль',[u.university,u.hometown_city].filter(Boolean).join(', '))});
 D.listings.forEach(l=>add(ms(l.created_at),'listing','Объявление',l.owner_id,'listings',l._id,'подал объявление: '+[l.city,'€'+l.price].join(', '),stT(l)));
 D.reviews.forEach(r=>add(ms(r.created_at),'review','Отзыв',r.user_id,'reviews',r._id,'оставил отзыв',(r.text||'').slice(0,120)));
 D.subscriptions.forEach(s=>add(ms(s.created_at),'sub','Подписка',s.user_id,'subscriptions',s._id,'подписался на поиск: '+[s.city,s.room].join(', '),s.price_max>=1e9?'без лимита цены':'до €'+s.price_max));
 EV.sort((a,b)=>b.t-a.t)}

/* ---------- статистика ---------- */
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const nIn=(a,f)=>a.filter(r=>inR(ms(f(r)))).length;
const cnt=(a,f,n=8)=>{const m={};a.forEach(r=>{const k=f(r);if(k!=null&&k!=='')m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,n)};
function days(a,f){const e=R.to||Date.now(),s=Math.max(R.from||e-29*864e5,e-89*864e5),m={};
 a.forEach(r=>{const t=ms(f(r));if(t)m[dkey(t)]=(m[dkey(t)]||0)+1});
 const o=[],d=new Date(s);d.setHours(0,0,0,0);while(d.getTime()<=e){o.push([p2(d.getDate())+'.'+p2(d.getMonth()+1),m[dkey(d)]||0]);d.setDate(d.getDate()+1)}return o}
function avgBy(){const m={};D.listings.forEach(l=>{if(l.city&&+l.price){(m[l.city]=m[l.city]||[]).push(+l.price)}});
 return Object.entries(m).map(([k,v])=>[k,Math.round(v.reduce((a,b)=>a+b)/v.length)]).sort((a,b)=>b[1]-a[1]).slice(0,8)}
const W=[
 ['u','Пользователи','k',()=>[D.users.length,'+'+nIn(D.users,r=>r.first_seen)+' за период']],
 ['a','Заходили в бота','k',()=>{const n=nIn(D.users,r=>r.last_seen);return[n,pct(n,D.users.length)+' от всех']}],
 ['l','Объявления','k',()=>[D.listings.length,'+'+nIn(D.listings,r=>r.created_at)+' за период']],
 ['pe','На модерации','k',()=>[D.listings.filter(x=>x.status==='pending').length,'ждут решения']],
 ['lv','Опубликовано','k',()=>[D.listings.filter(x=>x.active&&x.status!=='pending').length,'сейчас в поиске']],
 ['rv','Отзывы','k',()=>[D.reviews.length,'+'+nIn(D.reviews,r=>r.created_at)+' за период']],
 ['sb','Подписки на поиск','k',()=>[D.subscriptions.length,'+'+nIn(D.subscriptions,r=>r.created_at)+' за период']],
 ['pf','Профиль заполнен','k',()=>{const n=D.users.filter(r=>r.profile_completed).length;return[pct(n,D.users.length),n+' из '+D.users.length]}],
 ['ow','Подали объявление','k',()=>{const n=new Set(D.listings.map(x=>String(x.owner_id))).size;return[pct(n,D.users.length),n+' чел.']}],
 ['pr','Средняя цена','k',()=>{const p=D.listings.map(x=>+x.price).filter(Boolean);return[p.length?'€'+Math.round(p.reduce((a,b)=>a+b)/p.length):'—','по '+p.length+' объявлениям']}],
 ['du','Новые пользователи по дням','d',()=>days(D.users,r=>r.first_seen)],
 ['da','Заходы в бота по дням (последний вход)','d',()=>days(D.users,r=>r.last_seen)],
 ['dl','Новые объявления по дням','d',()=>days(D.listings,r=>r.created_at)],
 ['cc','Города объявлений','h',()=>cnt(D.listings,x=>x.city)],
 ['un','Университеты','h',()=>cnt(D.users,r=>r.university)],
 ['co','Страны','h',()=>cnt(D.users,r=>r.country)],
 ['hc','Родные города','h',()=>cnt(D.users,r=>r.hometown_city)],
 ['lg','Языки','h',()=>cnt(D.users,r=>r.language)],
 ['rm','Типы размещения','h',()=>cnt(D.listings,x=>x.room)],
 ['pc','Средняя цена по городам, €','h',avgBy],
 ['st','Статусы объявлений','h',()=>cnt(D.listings,stT)]];
let OFF=['hc','lg','st'];try{OFF=JSON.parse(localStorage.getItem('crm_off'))||OFF}catch(e){}
const bars=s=>{const m=Math.max(1,...s.map(x=>x[1]));return`<div class="bars">${s.map(([l,v])=>`<i title="${l}: ${v}" style="height:${Math.max(2,v/m*100)}%"></i>`).join('')}</div><div class="ax"><span>${s[0][0]}</span><span>${s.at(-1)[0]}</span></div>`};
const hbars=s=>{if(!s.length)return'<div class="empty">Нет данных</div>';const m=Math.max(1,...s.map(x=>x[1]));return s.map(([l,v])=>`<div class="hb"><u style="width:${v/m*100}%"></u><span>${esc(l)}</span><b>${v}</b></div>`).join('')};
function renderStats(){
 const on=W.filter(w=>!OFF.includes(w[0]));
 $('#st').innerHTML=`<div class="kp">${on.filter(w=>w[2]==='k').map(w=>{const[v,s]=w[3]();return`<div class="k"><span>${w[1]}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`}).join('')}</div>
 <div class="cg">${on.filter(w=>w[2]!=='k').map(w=>`<div class="c ${w[2]==='d'?'w':''}"><h3>${w[1]}</h3>${w[2]==='d'?bars(w[3]()):hbars(w[3]())}</div>`).join('')}</div>`}
function settings(){
 const d=$('#cw');d.innerHTML=`<h2>Что показывать в обзоре</h2><p>Выбор сохраняется в этом браузере.</p>${W.map(w=>`<label><input type="checkbox" data-w="${w[0]}" ${OFF.includes(w[0])?'':'checked'}> ${w[1]}</label>`).join('')}<div class="row"><button id="wr">Сбросить</button><button class="p" id="wo">Готово</button></div>`;
 d.onchange=e=>{const w=e.target.dataset.w;OFF=OFF.filter(x=>x!==w);if(!e.target.checked)OFF.push(w);try{localStorage.setItem('crm_off',JSON.stringify(OFF))}catch(x){}renderStats()};
 d.querySelector('#wo').onclick=()=>d.close();
 d.querySelector('#wr').onclick=()=>{OFF=['hc','lg','st'];try{localStorage.removeItem('crm_off')}catch(x){}renderStats();settings()};d.showModal()}

/* ---------- фильтры ---------- */
function buildFilters(){
 const fa=FA[tab]||[],b=base();
 $('#fp').innerHTML=fa.map(([n,f])=>{const m={};b.forEach(r=>{const v=f(r);if(v!=null&&v!=='')m[v]=(m[v]||0)+1});
  return`<label>${n}<select data-f="${n}"><option value="">Все</option>${Object.entries(m).sort((x,y)=>y[1]-x[1]).map(([v,c])=>`<option value="${esc(v)}" ${F[n]===v?'selected':''}>${esc(v)} (${c})</option>`).join('')}</select></label>`}).join('')
 +(tab==='listings'?`<label>Цена от, €<input type="number" data-f="pmin" value="${F.pmin||''}"></label><label>Цена до, €<input type="number" data-f="pmax" value="${F.pmax||''}"></label>`:'')
 +'<button class="rs" id="frs">Сбросить всё</button>';
 const n=Object.values(F).filter(Boolean).length;$('#fb').textContent='Фильтры'+(n?' ('+n+')':'')}
function rows(){
 const s=q.trim().toLowerCase(),fa=FA[tab]||[];
 return base().filter(r=>{
  if(!inR(TM[tab](r)))return false;
  for(const[n,f]of fa)if(F[n]&&String(f(r))!==F[n])return false;
  if(tab==='listings'){if(F.pmin&&!(+r.price>=+F.pmin))return false;if(F.pmax&&!(+r.price<=+F.pmax))return false}
  return!s||(tab==='activity'?(who(r.uid)+r.label+r.txt+(r.det||'')):JSON.stringify(r)).toLowerCase().includes(s)
 }).sort((a,b)=>TM[tab](b)-TM[tab](a))}

/* ---------- отрисовка ---------- */
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').focus()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3500)}
async function load(){
 try{D=await api('data');buildEv();$('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#upd').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});nav();buildFilters();render()}
 catch(e){if(e.message!=='auth')toast(e.message)}}
function nav(){$('#nav').innerHTML='<h1>Italy Housing</h1>'+TABS.map(([k,i,n])=>`<button data-t="${k}" class="${k===tab?'on':''}"><span class="i">${i}</span>${n}<span class="n">${k==='stats'?'':k==='activity'?EV.length:D[k].length}</span></button>`).join('')+'<span class="sp"></span><button id="lo">Выйти</button>'}
function chips(){$('#ch').innerHTML=[['all','Все'],[1,'Сегодня'],[7,'7 дней'],[30,'30 дней'],[90,'90 дней']].map(([k,n])=>`<button data-c="${k}" class="${R.chip===k||String(R.chip)===String(k)?'on':''}">${n}</button>`).join('')}
function render(){
 const isL=!['stats','activity'].includes(tab);
 $('#ttl').textContent=TABS.find(t=>t[0]===tab)[2];
 chips();$('#dfl').classList.toggle('hide',tab!=='users');$('#cfg').classList.toggle('hide',tab!=='stats');
 $('#fb').classList.toggle('hide',tab==='stats');$('#q').classList.toggle('hide',tab==='stats');if(tab==='stats')$('#fp').classList.add('hide');
 ['st','ls','fd'].forEach(k=>$('#'+k).classList.add('hide'));$('#em').classList.add('hide');$('#more').classList.add('hide');
 if(tab==='stats'){$('#st').classList.remove('hide');renderStats();bar();return}
 view=rows();const part=view.slice(0,lim);
 if(!view.length)$('#em').classList.remove('hide');
 $('#more').classList.toggle('hide',view.length<=lim);$('#more').textContent=`Показать ещё (${view.length-lim})`;
 if(tab==='activity'){$('#fd').classList.remove('hide');let last='';
  $('#fd').innerHTML=part.map(e=>{const h=dayHead(e.t),hd=h!==last?`<div class="day">${h}</div>`:'';last=h;
   return hd+`<div class="ev" data-c="${e.col}" data-id="${esc(e.id)}"><span class="dot ${e.type}"></span><div><b>${esc(who(e.uid))}</b> ${esc(e.txt)}${e.det?`<small>${esc(e.det)}</small>`:''}</div><time title="${dtstr(e.t)}">${new Date(e.t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</time></div>`}).join('');bar();return}
 $('#ls').classList.remove('hide');const cols=C[tab];
 $('#th').innerHTML='<tr><th><input type="checkbox" id="all" aria-label="Выбрать все"></th>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';
 $('#tb').innerHTML=part.map(r=>`<tr data-id="${esc(r._id)}"><td class="ck0"><input type="checkbox" class="ck" ${sel.has(r._id)?'checked':''} aria-label="Выбрать"></td>${cols.map(c=>`<td data-l="${c[0]}">${c[1](r)}</td>`).join('')}</tr>`).join('');
 bar()}
function bar(){
 const ok=!['stats','activity'].includes(tab),n=ok?[...sel].filter(id=>D[tab].some(r=>r._id===id)).length:0;
 $('#bar').classList.toggle('hide',!n);$('#cnt').textContent='Выбрано: '+n;
 const a=$('#all');if(a&&ok){const v=view.filter(r=>sel.has(r._id)).length;a.checked=v>0&&v===view.length;a.indeterminate=v>0&&v<view.length}}

/* ---------- карточка ---------- */
function detail(col,id){
 const r=D[col].find(x=>x._id===id);if(!r)return;
 const skip=['_id','photo_urls','photos','photo_file_ids'];
 const rowsH=Object.entries(r).filter(([k])=>!skip.includes(k)).sort().map(([k,v])=>{
  const val=typeof v==='object'&&v!==null?JSON.stringify(v):v;
  return`<dt>${esc(k)}</dt><dd>${/_at$|_seen$/.test(k)&&ms(v)?esc(dtstr(ms(v)))+` (${esc(ago(ms(v)))})`:esc(val)}</dd>`}).join('');
 const ph=(r.photo_urls||[]).map(u=>`<img referrerpolicy="no-referrer" src="${esc(u)}" alt="">`).join('');
 const title=col==='users'?(r.name||'Без имени'):col==='listings'?[r.city,r.address].filter(Boolean).join(', '):col==='subscriptions'?who(r.user_id):(r.name||r.text||r._id);
 const mine=col==='users'?EV.filter(e=>String(e.uid)===id).slice(0,15):[];
 const can=col!=='users';
 $('#dr').innerHTML=`<button class="x" id="dx" aria-label="Закрыть">✕</button><h3>${cut(title,70)}</h3>${ph?`<div class="ph">${ph}</div>`:''}
 <div class="acts">${can&&r.active!==true?`<button class="p" data-a="on">${col==='listings'?'Опубликовать':'Показать'}</button>`:''}${can&&r.active!==false&&r.active!==undefined?'<button data-a="off">Скрыть</button>':''}<button class="g" data-a="del">Удалить</button></div>
 ${mine.length?`<h4>Последние действия</h4>${mine.map(e=>`<div class="ev"><span class="dot ${e.type}"></span><div>${esc(e.txt)}${e.det?`<small>${esc(e.det)}</small>`:''}</div><time>${esc(ago(e.t))}</time></div>`).join('')}`:''}
 <h4>Все поля</h4><dl>${rowsH}</dl>`;
 $('#dr').dataset.id=id;$('#dr').dataset.col=col;$('#dr').classList.remove('hide')}

/* ---------- удаление ---------- */
function ask(col,ids){return new Promise(res=>{
 const n=ids.length,d=$('#cf');d.className='dg';
 const info={listings:'Объявление пропадёт из бота и мини-приложения. Сообщения в чате модерации и файлы фото останутся.',users:'Удалится профиль пользователя. Если он снова нажмёт /start, профиль создастся заново.',reviews:'Отзыв пропадёт из мини-приложения.',subscriptions:'Подписка на поиск будет отменена.'}[col];
 const lc=col==='users'?ids.reduce((a,i)=>a+ownerN(i),0):0;
 d.innerHTML=`<h2>Удалить ${n>1?n+' записей':'запись'}?</h2><p>${info} Это нельзя отменить.</p>${col==='users'?`<label><input type="checkbox" id="cas" checked> Удалить всё: объявления (${lc}), анкету, отзывы, подписки</label>`:''}<div id="tw"></div><div class="row"><button id="no">Отмена</button><button class="d" id="yes">Удалить</button></div>`;
 const need=()=>n>1||(col==='users'&&$('#cas').checked);
 const sync=()=>{const w=$('#tw');if(need()){if(!w.innerHTML)w.innerHTML='<p>Для подтверждения введите <b>УДАЛИТЬ</b></p><input type="text" id="tp" autocomplete="off">';$('#yes').disabled=$('#tp').value.trim().toUpperCase()!=='УДАЛИТЬ'}else{w.innerHTML='';$('#yes').disabled=false}};
 d.onchange=sync;d.oninput=sync;sync();let out=null;
 $('#no').onclick=()=>d.close();$('#yes').onclick=()=>{out={cascade:!!$('#cas')?.checked};d.close()};
 d.onclose=()=>res(out);d.showModal()})}
async function del(col,ids){
 const o=await ask(col,ids);if(!o||busy)return;busy=true;
 try{const r=await api('delete',{col,ids,...o});const x=Object.entries(r.also).map(([k,v])=>`${k}: ${v}`).join(', ');
  toast(`Удалено: ${r.deleted}${x?' (+ '+x+')':''}`);ids.forEach(i=>sel.delete(i));$('#dr').classList.add('hide');await load()}
 catch(e){toast(e.message)}finally{busy=false}}
async function setActive(col,ids,on){
 try{await api('active',{col,ids,on});toast(on?'Показано':'Скрыто');$('#dr').classList.add('hide');await load()}catch(e){toast(e.message)}}

/* ---------- события интерфейса ---------- */
const redo=()=>{lim=100;render()};
function setChip(k){R.chip=k;if(k==='all'){R.from=R.to=0}else{R.from=sod(Date.now())-(k-1)*864e5;R.to=0}$('#d1').value=R.from?dkey(R.from):'';$('#d2').value='';redo()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 try{await api('login',{email:$('#em_in').value.trim(),password:$('#pw').value});$('#pw').value=''}catch(x){$('#err').textContent=x.message}};
$('#nav').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='lo'){await api('logout');showLogin();return}
 tab=b.dataset.t;F={};q='';$('#q').value='';sel.clear();lim=100;$('#dr').classList.add('hide');$('#fp').classList.add('hide');nav();buildFilters();render()};
$('#ch').onclick=e=>{const b=e.target.closest('button');if(b)setChip(b.dataset.c==='all'?'all':+b.dataset.c)};
$('#d1').onchange=e=>{R.chip='';R.from=e.target.value?new Date(e.target.value+'T00:00').getTime():0;redo()};
$('#d2').onchange=e=>{R.chip='';R.to=e.target.value?new Date(e.target.value+'T23:59:59').getTime():0;redo()};
$('#dfl').onchange=e=>{df=e.target.value;redo()};
$('#q').oninput=e=>{q=e.target.value;redo()};
$('#fb').onclick=()=>$('#fp').classList.toggle('hide');
$('#fp').onchange=e=>{const k=e.target.dataset.f;if(k){F[k]=e.target.value;buildFilters();redo()}};
$('#fp').onclick=e=>{if(e.target.id==='frs'){F={};R={from:0,to:0,chip:'all'};q='';$('#q').value='';$('#d1').value=$('#d2').value='';buildFilters();redo()}};
$('#cfg').onclick=settings;$('#rf').onclick=load;
$('#more').onclick=()=>{lim+=100;render()};
$('#th').onchange=e=>{if(e.target.id!=='all')return;view.forEach(r=>e.target.checked?sel.add(r._id):sel.delete(r._id));document.querySelectorAll('.ck').forEach(c=>c.checked=e.target.checked);bar()};
$('#tb').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;
 if(e.target.classList.contains('ck')){e.target.checked?sel.add(tr.dataset.id):sel.delete(tr.dataset.id);bar();return}
 detail(tab,tr.dataset.id)};
$('#fd').onclick=e=>{const v=e.target.closest('.ev');if(v)detail(v.dataset.c,v.dataset.id)};
$('#clr').onclick=()=>{sel.clear();render()};
$('#bd').onclick=()=>del(tab,[...sel].filter(id=>D[tab].some(r=>r._id===id)));
$('#dr').onclick=e=>{const id=$('#dr').dataset.id,col=$('#dr').dataset.col;
 if(e.target.id==='dx')$('#dr').classList.add('hide');const a=e.target.dataset.a;if(!a)return;
 a==='del'?del(col,[id]):setActive(col,[id],a==='on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#dr').classList.add('hide')});
auth.onAuthStateChanged(u=>u?load():showLogin());
</script>
</body>
</html>

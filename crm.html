<!DOCTYPE html>
<!-- Italy Housing CRM · v3.0 Pro -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F8" id="mtc">
<title>Italy Housing — CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%230C7C86'/%3E%3Cpath%20d='M6%2011.5%2012%206l6%205.5'%20stroke='white'%20stroke-width='1.8'%20fill='none'%20stroke-linecap='round'/%3E%3Cpath%20d='M8%2010.8V18h8v-7.2'%20stroke='white'%20stroke-width='1.8'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
 --bg:#F1F3F8;--pn:#FFFFFF;--pn2:#F6F8FB;--ink:#151F2E;--ink2:#31405A;--dim:#61708A;--ln:#DFE5EE;--ln2:#EAEEF5;
 --acc:#0C7C86;--acc2:#4FC1CC;--ai:#FFFFFF;--accsoft:rgba(12,124,134,.12);
 --bad:#C0392F;--bad2:#FBEAE8;--ok:#237A50;--ok2:#E3F3E9;--wn:#8F6408;--wn2:#FBF0D7;--of:#5A6A80;--of2:#E8ECF2;
 --bl:#2F6FB0;--bl2:#E6EFF9;--vi:#7A5BB5;--vi2:#EFEAF9;--barln:rgba(255,255,255,.28);
 --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh2:0 14px 36px -10px rgba(16,24,40,.22);
 --r:14px;--r2:10px;color-scheme:light;--font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme=dark]{
 --bg:#0C121B;--pn:#131A25;--pn2:#1A2331;--ink:#E8EDF5;--ink2:#C3CCDA;--dim:#8B98AD;--ln:#25303F;--ln2:#1E2836;
 --acc:#45BECB;--acc2:#45BECB;--ai:#06272B;--accsoft:rgba(69,190,203,.16);
 --bad:#F07B6E;--bad2:#3A1D1A;--ok:#68C88E;--ok2:#16301F;--wn:#E4B867;--wn2:#33280F;--of:#98A6BA;--of2:#222D3D;
 --bl:#79ADE8;--bl2:#16283C;--vi:#B49CEC;--vi2:#241C38;--barln:rgba(0,0,0,.2);
 --sh:0 1px 2px rgba(0,0,0,.45);--sh2:0 16px 44px -12px rgba(0,0,0,.65)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0C121B;--pn:#131A25;--pn2:#1A2331;--ink:#E8EDF5;--ink2:#C3CCDA;--dim:#8B98AD;--ln:#25303F;--ln2:#1E2836;
 --acc:#45BECB;--acc2:#45BECB;--ai:#06272B;--accsoft:rgba(69,190,203,.16);
 --bad:#F07B6E;--bad2:#3A1D1A;--ok:#68C88E;--ok2:#16301F;--wn:#E4B867;--wn2:#33280F;--of:#98A6BA;--of2:#222D3D;
 --bl:#79ADE8;--bl2:#16283C;--vi:#B49CEC;--vi2:#241C38;--barln:rgba(0,0,0,.2);
 --sh:0 1px 2px rgba(0,0,0,.45);--sh2:0 16px 44px -12px rgba(0,0,0,.65)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
::selection{background:var(--accsoft)}
*{scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}::-webkit-scrollbar-track{background:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.hide{display:none!important}
kbd,.kk,.pk{font:600 10.5px/1 var(--font);color:var(--dim);border:1px solid var(--ln);border-radius:6px;padding:3px 6px;background:var(--pn2);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}.w100{width:100%}
.i{width:17px;height:17px;flex:none}

/* ── кнопки и поля ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ln);background:var(--pn);border-radius:10px;padding:8px 13px;font-weight:500;cursor:pointer;transition:box-shadow .15s,background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh)}
.btn:active{transform:translateY(1px)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ai);border-color:transparent;font-weight:600;box-shadow:0 4px 14px var(--accsoft)}
.btn.p:hover{filter:brightness(1.05)}
.btn.d{background:var(--bad);color:#fff;border-color:transparent;font-weight:600}
.btn.d:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--acc);font-weight:600}
.btn.ghost:hover{background:var(--accsoft);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ico{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--ln);background:var(--pn);border-radius:10px;cursor:pointer;position:relative;transition:box-shadow .15s,border-color .15s}
.ico:hover{border-color:var(--acc);box-shadow:var(--sh)}
.ico .i{width:17px;height:17px}
#rf.auto::after{content:'';position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 2px var(--pn)}
.spin .i{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
input[type=date]{width:142px}

/* ── сплеш ── */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
#splash .sbox{display:grid;place-items:center;gap:16px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:inline-grid;place-items:center;color:#fff;box-shadow:0 8px 20px var(--accsoft);flex:none}
.logo.big{width:58px;height:58px;border-radius:17px;animation:pl 1.2s ease-in-out infinite}
.logo.big .i{width:27px;height:27px}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(.9);opacity:.8}}
#splash .smsg{margin:0;color:var(--dim);font-size:13.5px;max-width:300px;text-align:center}

/* ── логин ── */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
#login::before,#login::after{content:'';position:absolute;width:540px;height:540px;border-radius:50%;filter:blur(100px);background:radial-gradient(circle,var(--acc),transparent 65%);opacity:.28;pointer-events:none}
#login::before{top:-180px;right:-140px}
#login::after{bottom:-200px;left:-160px;opacity:.18}
.card{position:relative;z-index:1;width:min(390px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:26px;box-shadow:var(--sh2);display:grid;gap:14px;animation:pop .25s ease-out}
.card .brand{justify-content:center;margin-bottom:2px}
.card h1{margin:0;font-size:20px;text-align:center;letter-spacing:-.01em}
.card .sub2{margin:-8px 0 2px;color:var(--dim);font-size:13px;text-align:center}
.fld{display:grid;gap:5px;font-size:12.5px;color:var(--dim);font-weight:500}
.fld input{width:100%}
.pw{position:relative;display:block}
.pw input{padding-right:42px}
.pw .ico{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;box-shadow:none}
.pw .ico:hover{border:0;box-shadow:none;color:var(--acc)}
#err{color:var(--bad);min-height:1.2em;margin:0;font-size:13px}
#caps{color:var(--wn);font-size:12.5px;margin:-8px 0 0}
.card .foot{color:var(--dim);font-size:12px;text-align:center;margin:0}
.shake{animation:shake .32s}
@keyframes shake{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-3px 0}}
.brand{display:flex;gap:11px;align-items:center}
.brand b{font-size:15.5px;line-height:1.2;display:block}
.brand small{color:var(--dim);font-size:11.5px}

/* ── каркас ── */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
nav{background:var(--pn);border-right:1px solid var(--ln);padding:16px 12px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.ng{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:14px 10px 5px;font-weight:700}
.ng:first-of-type{margin-top:6px}
.ni{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:500;cursor:pointer;position:relative;transition:background .13s,color .13s;width:100%}
.ni:hover{background:var(--bg);color:var(--ink)}
.ni.on{background:var(--accsoft);color:var(--acc);font-weight:600}
.ni .i{width:18px;height:18px}
.ni .n{margin-left:auto;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--of2);border-radius:99px;padding:2px 8px;font-weight:600}
.ni.on .n{background:transparent;color:var(--acc)}
.ni .n.warn{background:var(--wn2);color:var(--wn)}
.sfoot{margin-top:auto;border-top:1px solid var(--ln2);padding-top:10px;display:flex;align-items:center;gap:8px}
.sfoot .who{flex:1;min-width:0}
.sfoot .who b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sfoot .who small{color:var(--dim);font-size:11px}
main{padding:20px 26px 130px;min-width:0;width:100%;max-width:1480px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.sub{color:var(--dim);font-size:12.5px;display:block;margin-top:1px}
.hacts{display:flex;gap:8px;margin-left:auto}

/* ── тулбар ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.search{position:relative;flex:1 1 250px;max-width:430px}
.search .kicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);display:flex}
.search .kicon .i{width:15px;height:15px}
.search input{width:100%;padding-left:33px;padding-right:34px}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:2px;background:var(--pn);border:1px solid var(--ln);border-radius:11px;padding:3px;max-width:100%;overflow-x:auto}
.chips button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--dim);cursor:pointer;white-space:nowrap;transition:background .13s,color .13s}
.chips button:hover{color:var(--ink);background:var(--bg)}
.chips button.on{background:var(--acc);color:var(--ai);font-weight:600}
.dates{display:flex;gap:6px;align-items:center}
.dsh{color:var(--dim)}
#dfl{max-width:170px}
.btn.hasn{border-color:var(--acc);color:var(--acc);font-weight:600}

/* ── сохранённые виды ── */
.sv{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
.sv.hide{display:none}
.svl{display:inline-flex;gap:6px;align-items:center;color:var(--dim);font-size:12.5px;font-weight:600}
.svl .i{width:14px;height:14px}
.vch{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--ln);border-radius:99px;padding:5px 6px 5px 12px;background:var(--pn);font-size:12.5px;cursor:pointer;transition:border-color .13s}
.vch:hover{border-color:var(--acc)}
.vx{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:99px;color:var(--dim)}
.vx:hover{background:var(--bad2);color:var(--bad)}
.vx .i{width:11px;height:11px}

/* ── панель фильтров ── */
.fp{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:4px 0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;box-shadow:var(--sh2);animation:pop .16s ease-out}
.fp label{display:grid;gap:4px;color:var(--dim);font-size:12px;font-weight:500}
.fp select,.fp input{width:100%;color:var(--ink);font-size:14px}
.fphead{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.fphead b{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.fphead b .i{color:var(--acc)}
.fphead .sp{flex:1}
.rs2{grid-column:1/-1;display:flex;justify-content:flex-end}

/* ── KPI ── */
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:12px}
.k{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s}
.k:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--accsoft)}
.k .kl{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:12.5px;font-weight:500;padding-right:80px}
.k .kl .i{width:15px;height:15px;color:var(--acc)}
.k b{display:block;font-size:27px;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-weight:700}
.k .ks{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.spark{position:absolute;right:14px;top:13px;width:72px;height:30px}
.pgr{display:block;height:5px;border-radius:99px;background:var(--of2);margin-top:10px;overflow:hidden}
.pgr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
.dlt{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;vertical-align:1px}
.dlt.up{background:var(--ok2);color:var(--ok)}
.dlt.dn{background:var(--bad2);color:var(--bad)}
.dlt.eq{background:var(--of2);color:var(--of)}

/* ── алерт модерации ── */
.alert{display:flex;gap:12px;align-items:center;background:linear-gradient(115deg,var(--wn2),transparent 65%),var(--pn);border:1px solid var(--wn2);border-radius:var(--r);padding:13px 16px;margin-bottom:12px;box-shadow:var(--sh);flex-wrap:wrap}
.alert>.i{color:var(--wn);width:20px;height:20px}
.alert b{font-size:14.5px}
.alert small{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
.alert .btn{margin-left:auto}

/* ── карточки графиков ── */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0;transition:box-shadow .18s}
.c:hover{box-shadow:var(--sh2)}
.c.w{grid-column:1/-1}
.c h3{margin:0;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c h3>.i{width:15px;height:15px;color:var(--acc)}
.csub{margin-left:auto;color:var(--dim);font-size:12px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.segs{display:flex;gap:2px;flex-wrap:wrap}
.segs button{border:0;background:var(--bg);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--dim);font-weight:500;cursor:pointer;transition:background .13s,color .13s}
.segs button:hover{color:var(--ink)}
.segs button.on{background:var(--accsoft);color:var(--acc);font-weight:600}
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.gl{stroke:var(--ln2)}
.gt{fill:var(--dim);font-size:11px;font-family:var(--font)}
.gv{stroke:var(--dim);stroke-dasharray:3 3;opacity:0;pointer-events:none}
.gdot{fill:var(--acc);stroke:var(--pn);stroke-width:2;opacity:0;pointer-events:none}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s;z-index:2;box-shadow:var(--sh2);font-variant-numeric:tabular-nums}
.dnut{display:flex;gap:18px;align-items:center;margin-top:12px}
.dsvg{flex:none;width:128px}
.dnum{font-size:21px;font-weight:700;fill:var(--ink)}
.dlbl{font-size:9.5px;fill:var(--dim);letter-spacing:.05em}
.dseg{transition:opacity .15s;cursor:pointer}
.dseg:hover{opacity:.8}
.legend{display:grid;gap:4px;min-width:0;flex:1}
.legend button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 8px;border-radius:9px;font-size:13px;color:var(--ink2);cursor:pointer;text-align:left}
.legend button:hover{background:var(--bg)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend small{color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}
.legend b{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.hint{display:block;margin-top:12px;color:var(--dim);font-size:12px}
.fun{display:grid;gap:12px;margin-top:14px}
.fn .fl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--ink2)}
.fn .fl b{font-variant-numeric:tabular-nums}
.pc2{font-style:normal;color:var(--dim);font-weight:500;font-size:11.5px}
.fn .fb{height:10px;border-radius:99px;background:var(--of2);overflow:hidden}
.fn .fb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.hb{position:relative;display:flex;justify-content:space-between;gap:8px;padding:5.5px 10px;margin-top:3px;border-radius:8px;overflow:hidden;font-size:13px}
.hb u{position:absolute;left:0;top:0;bottom:0;background:var(--accsoft);border-radius:6px;z-index:0}
.hb span,.hb b{position:relative;z-index:1}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb b{font-variant-numeric:tabular-nums}
.skel{background:linear-gradient(90deg,var(--of2) 25%,var(--bg) 45%,var(--of2) 65%);background-size:200% 100%;animation:shim 1.1s infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}

/* ── лента активности ── */
.day{position:sticky;top:0;z-index:2;margin:16px 0 8px;color:var(--dim);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(6px);padding:5px 2px;border-radius:8px}
@supports not (background:color-mix(in srgb,red,blue)){.day{background:var(--bg)}}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;box-shadow:var(--sh);transition:border-color .14s,transform .14s}
.ev:hover{border-color:var(--acc);transform:translateX(3px)}
.ev.static{cursor:default;box-shadow:none}
.ev.static:hover{transform:none;border-color:var(--ln)}
.eic{flex:none;width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:var(--of2);color:var(--of)}
.eic .i{width:15px;height:15px}
.eic.new{background:var(--ok2);color:var(--ok)}
.eic.start{background:var(--bl2);color:var(--bl)}
.eic.profile{background:var(--vi2);color:var(--vi)}
.eic.listing{background:var(--accsoft);color:var(--acc)}
.eic.review{background:var(--wn2);color:var(--wn)}
.eic.sub{background:var(--of2);color:var(--of)}
.ev>div{flex:1;min-width:0}
.ev b{font-weight:600}
.ev small{display:block;color:var(--dim);margin-top:1px}
.ev time{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ach{margin-bottom:12px}

/* ── таблица ── */

.b{display:inline-block;padding:2.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok2);color:var(--ok)}
.b.wn{background:var(--wn2);color:var(--wn)}
.b.of{background:var(--of2);color:var(--dim)}
.qa{white-space:nowrap;text-align:right}
.qab{width:29px;height:29px;padding:0;display:inline-grid;place-items:center;border:1px solid transparent;background:var(--bg);color:var(--dim);border-radius:8px;cursor:pointer;opacity:0;transition:opacity .12s,color .12s,border-color .12s;margin-left:4px}

.qab:hover{color:var(--acc);border-color:var(--ln)}

/* ── пусто / ошибки ── */
.empty{padding:52px 20px;text-align:center;color:var(--dim);background:var(--pn);border:1.5px dashed var(--ln);border-radius:var(--r);margin-top:8px;display:grid;place-items:center;gap:4px}

/* ── шторка ── */

/* ── диалоги ── */
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--pn);color:var(--ink);padding:20px;width:min(460px,calc(100vw - 24px));box-shadow:var(--sh2)}

#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:min(92vw,500px);pointer-events:none}

#offb{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;text-align:center;padding:6px 10px;font-size:13px;z-index:95;font-weight:500}
@keyframes pop{from{transform:scale(.96) translateY(5px);opacity:0}}

body.dense td{padding:5px 10px}
body.dense .k{padding:10px 13px}
body.dense .k b{font-size:22px}
body.dense .ev{padding:8px 11px}

@media (max-width:900px){

 .brand,.ng,.sfoot{display:none}
 .ni{flex:1 0 auto;flex-direction:column;gap:3px;font-size:10px;padding:6px 8px;text-align:center;font-weight:500;width:auto;min-width:62px}

const FL={_id:'ID',id:'Telegram ID',name:'Имя',username:'Username',city:'Город',price:'Цена, €',address:'Адрес',housing_type:'Тип жилья',room:'Размещение',contract:'Контракт',status:'Статус',active:'Активно',owner_id:'ID автора',created_at:'Создано',updated_at:'Обновлено',first_seen:'Регистрация',last_seen:'Был(а) в боте',profile_completed:'Профиль заполнен',university:'Университет',country:'Страна',hometown_city:'Родной город',language:'Язык',user_id:'ID пользователя',text:'Текст',price_max:'Цена до, €'};
function fmtVal(k,v){
 if(typeof v==='boolean')return v?'<b>Да</b>':'Нет';
 if(k==='price')return eur(v);
 if(k==='price_max')return v>=1e9?'без лимита':eur(v);
 if(/_at$|_seen$/.test(k)&&ms(v))return esc(dtstr(ms(v)))+` <span class="dim2">(${esc(ago(ms(v)))})</span>`;
 if(Array.isArray(v))return esc(v.join(', '));
 if(v&&typeof v==='object')return '<code>'+esc(JSON.stringify(v))+'</code>';
 if(k==='_id'||k==='id'||/_id$/.test(k))return '<span class="mono">'+esc(v)+'</span>';
 return esc(v??'—')}

 const tg=isU&&r.username?`<a class="btn" target="_blank" rel="noopener" href="https://t.me/${esc(r.username)}">${ic('send')}Telegram</a>`:'';
 const showBtn=!isU&&r.active!==true?`<button class="btn p" data-a="on">${isL?'Опубликовать':'Показать'}</button>`:'';

 dr.innerHTML=`<div class="dh">${head}<div class="tt"><h3>${esc(title)}</h3><small>${esc(sub||col)}</small></div><button class="ico" id="dx" aria-label="Закрыть">${ic('x')}</button></div>

 <h4 class="dsec">Все поля</h4><dl class="fields">${fields}</dl>

 dr.dataset.id=id;dr.dataset.col=col;dr.classList.remove('hide');

let PALS=[],PALI=0;
function searchRecs(s){const out=[];const push=(col,id,t,sub2)=>{if(t&&t.toLowerCase().includes(s))out.push({col,id,t,sub:sub2,sc:t.toLowerCase().startsWith(s)?2:1})};
 (D.users||[]).forEach(u=>push('users',u._id,[u.name,u.username].filter(Boolean).join(' '),[u.university,u.country].filter(Boolean).join(', ')));
 (D.listings||[]).forEach(l=>push('listings',l._id,[l.city,l.address].filter(Boolean).join(', '),(l.price!=null?'€'+l.price:'')+' · '+who(l.owner_id)));
 (D.reviews||[]).forEach(r=>push('reviews',r._id,cut(r.text,60),r.name||''));
 (D.subscriptions||[]).forEach(x=>push('subscriptions',x._id,[x.city,x.room].filter(Boolean).join(', '),'подписка · '+who(x.user_id)));
 return out.sort((a,b)=>b.sc-a.sc).slice(0,8)}
function palData(qy){const s=(qy||'').trim().toLowerCase();
 const acts=[];
 TABS.forEach(([k,i2,n2])=>acts.push({ic:i2,t:n2,s:'Раздел',run:()=>go(k)}));
 acts.push({ic:'ref',t:'Обновить данные',s:'Действие',run:()=>load()});
 acts.push({ic:'down',t:'Экспорт CSV (текущий вид)',s:'Действие',run:exportCSV});
 acts.push({ic:'save',t:'Резервная копия JSON',s:'Действие',run:exportJSON});
 acts.push({ic:'sun',t:'Сменить тему',s:'Действие',run:cycleTheme});
 acts.push({ic:'set',t:'Настройки',s:'Действие',run:settings});
 acts.push({ic:'out',t:'Выйти из аккаунта',s:'Действие',run:doLogout});
 const f2=acts.filter(i=>!s||(i.t+' '+i.s).toLowerCase().includes(s));
 const recs=s?searchRecs(s):[];
 return{acts:f2,recs}}
const COLIC={listings:'home',users:'user',reviews:'star',subscriptions:'bell'};

/* ───────── удаление с возможностью отмены ───────── */
async function snapshot(col,ids,cascade){const out=[];
 const grab=async ref=>{const d=await ref.get();if(d.exists)out.push({ref:d.ref,data:d.data()})};
 for(const id of ids){
  if(col==='users'&&cascade){
   await grab(fdb.collection('users').doc(id));
   if(/^\d+$/.test(id)){
    for(const[c2,f2]of[['listings','owner_id'],['reviews','user_id'],['subscriptions','user_id']]){
     const qr=await fdb.collection(c2).where(f2,'==',Number(id)).get();
     qr.docs.forEach(d2=>out.push({ref:d2.ref,data:d2.data()}))}}
   await grab(fdb.collection('friend_profiles').doc(id))}
  else await grab(fdb.collection(col).doc(id))}
 return out}
function ask(col,ids){return new Promise(res=>{const n=ids.length,d=$('#cf');d.className='dg';
 const info={listings:'Объявление пропадёт из бота и мини-приложения. Сообщения в чате модерации и файлы фото останутся.',users:'Удалится профиль пользователя. Если он снова нажмёт /start, профиль создастся заново.',reviews:'Отзыв пропадёт из мини-приложения.',subscriptions:'Подписка на поиск будет отменена.'}[col]||'Запись будет удалена.';
 const lc=col==='users'?ids.reduce((a,i)=>a+ownerN(i),0):0;
 d.innerHTML=`<h2>Удалить ${n>1?nf.format(n)+' записей':'запись'}?</h2><p>${info} Это нельзя отменить.</p>${col==='users'?`<label class="ckl"><input type="checkbox" id="cas" checked> Удалить также: объявления (${lc}), анкету друга, отзывы, подписки</label>`:''}<div id="tw"></div><div class="row"><button id="no">Отмена</button><button class="btn d" id="yes">Удалить</button></div>`;
 const need=()=>n>1||(col==='users'&&d.querySelector('#cas')&&d.querySelector('#cas').checked);
 const sync=()=>{const w=d.querySelector('#tw');
  if(need()){if(!w.innerHTML)w.innerHTML='<p>Для подтверждения введите <b>УДАЛИТЬ</b></p><input type="text" id="tp" autocomplete="off" style="width:100%">';
   d.querySelector('#yes').disabled=d.querySelector('#tp').value.trim().toUpperCase()!=='УДАЛИТЬ'}
  else{w.innerHTML='';d.querySelector('#yes').disabled=false}};
 d.onchange=sync;d.oninput=sync;sync();let out=null;
 d.querySelector('#no').onclick=()=>d.close();
 d.querySelector('#yes').onclick=()=>{out={cascade:!!(d.querySelector('#cas')&&d.querySelector('#cas').checked)};d.close()};
 d.onclose=()=>{d.onclose=null;d.onchange=null;d.oninput=null;res(out)};
 if(!d.open)d.showModal()})}
async function doDelete(col,ids){if(busy)return;const o=await ask(col,ids);if(!o)return;busy=true;
 try{const snap=await snapshot(col,ids,!!o.cascade);
  if(!snap.length){toast('Записи уже не существуют');await load();return}
  const batch=fdb.batch();snap.forEach(s=>batch.delete(s.ref));await batch.commit();
  ids.forEach(i=>sel.delete(i));closeDr();
  toast(`Удалено: ${nf.format(snap.length)}`,{label:'Отменить',dur:9000,run:async()=>{
   try{const b2=fdb.batch();snap.forEach(s=>b2.set(s.ref,s.data));await b2.commit();toast('Восстановлено');await load()}
   catch(e){toast(ERRM[e.code]||e.message)}}});
  await load()}
 catch(e){toast(ERRM[e.code]||e.message)}
 finally{busy=false}}
async function setActive(col,ids,on){if(busy)return;busy=true;
 try{await api('active',{col,ids,on});
  toast(on?(col==='listings'?'Опубликовано':'Показано'):'Скрыто');
  sel.clear();closeDr();await load()}
 catch(e){toast(ERRM[e.code]||e.message)}
 finally{busy=false}}

/* ───────── экспорт ───────── */
const EXP={
 listings:[['Город','city'],['Тип жилья','housing_type'],['Размещение','room'],['Цена, EUR','price'],['Статус',stT],['Адрес','address'],['Автор',r=>who(r.owner_id)],['ID автора','owner_id'],['Создано',r=>r.created_at||''],['ID','_id']],
 users:[['Имя','name'],['Username','username'],['Telegram ID','id'],['ID','_id'],['Университет','university'],['Страна','country'],['Родной город','hometown_city'],['Язык','language'],['Профиль заполнен',r=>r.profile_completed?'да':'нет'],['Объявлений',r=>ownerN(r._id)],['Регистрация',r=>r.first_seen||''],['Был(а) в боте',r=>r.last_seen||'']],
 reviews:[['Автор','name'],['Username','username'],['Отзыв','text'],['Статус',r=>r.active===false?'Скрыто':'Активно'],['Создан',r=>r.created_at||''],['ID','_id']],
 subscriptions:[['Человек',r=>who(r.user_id)],['ID пользователя','user_id'],['Город','city'],['Тип','room'],['Цена до','price_max'],['Статус',r=>r.active===false?'Скрыто':'Активно'],['Создана',r=>r.created_at||''],['ID','_id']]};
const csvE=s=>{s=String(s??'');return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function dlFile(content,type,name){const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;
 document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}
function exportCSV(){const map=EXP[tab];
 if(!map||!view.length){toast('Нет данных для экспорта');return}
 const lines=[map.map(m=>csvE(m[0])).join(';')];
 view.forEach(r=>{lines.push(map.map(m=>{const v=m[1];const val=typeof v==='function'?v(r):r[v];return csvE(val==null?'':val)}).join(';'))});
 dlFile('\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8',`italy-housing-${tab}-${dkey(Date.now())}.csv`);
 toast(`Экспортировано: ${nf.format(view.length)} строк`)}
function exportJSON(){dlFile(JSON.stringify(Object.assign({exported_at:new Date().toISOString()},D),null,1),'application/json',`italy-housing-backup-${dkey(Date.now())}.json`);toast('Резервная копия сохранена')}

/* ───────── тосты, буфер обмена ───────── */
function toast(msg,o={}){const c=$('#toasts'),t=document.createElement('div');
 t.className='toast';
 const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
 if(o.label){const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>{kill();o.run()};t.appendChild(b)}
 c.appendChild(t);
 let done=false;const kill=()=>{if(done)return;done=true;t.remove()};
 setTimeout(kill,o.dur||3500)}
async function copyTxt(t){try{await navigator.clipboard.writeText(t);toast('Скопировано: '+cut(t,30))}
 catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');toast('Скопировано')}catch(e2){toast('Не удалось скопировать')}ta.remove()}}

async function load(){if(loading||!FIRE_OK)return;loading=true;
 $('#app').classList.remove('hide');$('#login').classList.add('hide');
 spin(true);
 if(!loaded){nav();render()}
 try{D=await api('data');buildEv();loaded=true;
  $('#upd').textContent='Обновлено в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+(CFG.auto?` · авто ${CFG.auto} мин`:'');
  if(!hashDone)applyHash();
  nav();buildFilters();render()}
 catch(e){
  if(e.message!=='auth'){
   if(!loaded){$('#skel').classList.add('hide');showErr(e.message)}
   else toast(e.message)}}
 finally{loading=false;spin(false)}}

function showLogin(){$('#splash').classList.add('hide');$('#app').classList.add('hide');$('#login').classList.remove('hide');
 const em=LS.get('crm_email','');if(em&&!$('#em_in').value)$('#em_in').value=em;
 setTimeout(()=>$('#em_in').focus(),50)}
function doLogout(){api('logout').then(()=>{showLogin();toast('Вы вышли из аккаунта')}).catch(e=>toast(ERRM[e.code]||e.message))}

/* ───────── обработчики ───────── */
function bind(){
 $$('.ico[data-ic],span[data-ic]').forEach(el=>{el.innerHTML=ic(el.dataset.ic)});
 const sk=$('#skel');
 sk.innerHTML=`<div class="kp">${('<div class="k"><span class="skel" style="display:block;width:60%;height:12px"></span><span class="skel" style="display:block;width:42%;height:24px;margin-top:12px"></span></div>').repeat(8)}</div><div class="cg"><div class="c"><span class="skel" style="display:block;width:38%;height:14px"></span><span class="skel" style="display:block;width:100%;height:130px;margin-top:14px"></span></div><div class="c"><span class="skel" style="display:block;width:52%;height:14px"></span><span class="skel" style="display:block;width:100%;height:130px;margin-top:14px"></span></div></div>`;
 $('#pin-ic').innerHTML=ic('search');
 $('#kk').textContent=MAC?'⌘K':'Ctrl+K';
 applyTheme();
 document.body.classList.toggle('dense',CFG.density==='dense');

 $('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
  const btn=$('#lf button[type=submit]');btn.disabled=true;const old=btn.textContent;btn.textContent='Вход…';
  try{await api('login',{email:$('#em_in').value.trim(),password:$('#pw').value});
   LS.set('crm_email',$('#em_in').value.trim());$('#pw').value=''}
  catch(x){$('#err').textContent=x.message;
   const c=$('#lcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  finally{btn.disabled=false;btn.textContent=old}};
 $('#pweye').onclick=()=>{const p=$('#pw'),show=p.type==='password';p.type=show?'text':'password';$('#pweye').innerHTML=ic(show?'eyeOff':'eye')};
 const capE=$('#caps');
 ['keydown','keyup'].forEach(ev=>$('#pw').addEventListener(ev,e=>{if(e.getModifierState)capE.classList.toggle('hide',!e.getModifierState('CapsLock'))}));

 $('#nav').onclick=e=>{const lo=e.target.closest('#lo');if(lo){doLogout();return}
  const b=e.target.closest('.ni');if(b)go(b.dataset.t)};
 $('#pk').onclick=openPal;
 $('#rf').onclick=()=>load();
 $('#thb').onclick=cycleTheme;
 $('#lo2').onclick=doLogout;
 $('#ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  const v=b.dataset.c;setChip(v==='all'||v==='custom'?v:+v)};
 $('#d1').onchange=e=>{R.from=e.target.value?new Date(e.target.value+'T00:00').getTime():0;R.chip=(R.from||R.to)?'custom':'all';redo()};
 $('#d2').onchange=e=>{R.to=e.target.value?new Date(e.target.value+'T23:59:59').getTime():0;R.chip=(R.from||R.to)?'custom':'all';redo()};
 $('#dfl').onchange=e=>{df=e.target.value;redo()};
 let qt=null;
 $('#q').oninput=e=>{q=e.target.value;clearTimeout(qt);qt=setTimeout(redo,160)};
 $('#fb').onclick=()=>{if(tab==='stats')return;$('#fp').classList.toggle('hide')};
 $('#csvb').onclick=exportCSV;
 $('#fp').onclick=e=>{
  if(e.target.closest('#fpx')){$('#fp').classList.add('hide');return}
  if(e.target.closest('#fsave')){saveViewAsk();return}
  if(e.target.closest('#frs')){resetFilters();return}};
 $('#fp').onchange=e=>{const sel2=e.target.closest('select[data-f],input[data-f]');
  if(sel2){F[sel2.dataset.f]=sel2.value;buildFilters();redo()}};
 $('#sv').onclick=e=>{
  const x=e.target.closest('.vx');
  if(x){VIEWS=VIEWS.filter(v=>v.id!==+x.dataset.x);LS.set('crm_views',VIEWS);renderSv();return}
  const c2=e.target.closest('.vch');
  if(c2){const v=VIEWS.find(v=>v.id===+c2.dataset.v);if(v)applyView(v);return}
  if(e.target.closest('#svadd'))saveViewAsk()};
 $('#th').onclick=e=>{const th=e.target.closest('th.srt');if(th)thSort(+th.dataset.i)};
 $('#th').onchange=e=>{if(e.target.id!=='all')return;const on=e.target.checked;
  view.forEach(r=>on?sel.add(r._id):sel.delete(r._id));
  $$('#tb .ck').forEach(c2=>c2.checked=on);barU()};
 $('#tb').onclick=e=>{
  const qb=e.target.closest('.qab');
  if(qb){const tr=qb.closest('tr');setActive(tab,[tr.dataset.id],qb.dataset.a==='on');return}
  const jn=e.target.closest('.jnum');
  if(jn){jump(jn.dataset.j,jn.dataset.id);return}
  if(e.target.classList.contains('ck')){
   const tr=e.target.closest('tr');
   e.target.checked?sel.add(tr.dataset.id):sel.delete(tr.dataset.id);barU();return}
  const tr=e.target.closest('tr');if(tr)detail(tab,tr.dataset.id)};
 $('#tb').onkeydown=e=>{if(e.key==='Enter'){const tr=e.target.closest('tr');if(tr)detail(tab,tr.dataset.id)}};
 $('#fd').onclick=e=>{
  const ach=e.target.closest('[data-ach]');
  if(ach){ACH=ach.dataset.ach;render();return}
  const ev=e.target.closest('.ev');if(ev)detail(ev.dataset.c,ev.dataset.id)};
 $('#em').onclick=e=>{
  if(e.target.closest('#emrs')){resetFilters();return}
  if(e.target.closest('#errt')){load();return}};
 $('#more').onclick=()=>{lim+=CFG.psize;render()};
 if('IntersectionObserver'in window){const io=new IntersectionObserver(en=>{
  if(en[0].isIntersecting&&!$('#more').classList.contains('hide')&&!loading){lim+=CFG.psize;render()}},{rootMargin:'400px'});
  io.observe($('#sentinel'))}
 $('#ba').onclick=()=>setActive(tab,[...sel].filter(id=>(D[tab]||[]).some(r=>r._id===id)),true);
 $('#bh').onclick=()=>setActive(tab,[...sel].filter(id=>(D[tab]||[]).some(r=>r._id===id)),false);
 $('#bd').onclick=()=>doDelete(tab,[...sel].filter(id=>(D[tab]||[]).some(r=>r._id===id)));
 $('#clr').onclick=()=>{sel.clear();render()};
 $('#dr').onclick=e=>{
  if(e.target.closest('#dx')){closeDr();return}
  const cp=e.target.closest('[data-cp]');if(cp){copyTxt(cp.dataset.cp);return}
  const jc=e.target.closest('[data-jc]');if(jc){const c3=jc.dataset.jc,i3=jc.dataset.jid;closeDr();jump(c3,i3);return}
  const a=e.target.closest('[data-a]');if(!a)return;
  const col=$('#dr').dataset.col,id=$('#dr').dataset.id;
  a.dataset.a==='del'?doDelete(col,[id]):setActive(col,[id],a.dataset.a==='on')};
 $('#scrim').onclick=closeDr;
 $('#pal').onclick=e=>{if(e.target.id==='pal')closePal()};
 $('#pi').oninput=()=>{PALI=0;renderPal()};
 $('#pi').onkeydown=e=>{
  if(e.key==='ArrowDown'){e.preventDefault();PALI=Math.min(PALS.length-1,PALI+1);hiPal()}
  else if(e.key==='ArrowUp'){e.preventDefault();PALI=Math.max(0,PALI-1);hiPal()}
  else if(e.key==='Enter'){e.preventDefault();const it=PALS[PALI];if(it){closePal();it.run()}}};
 $('#plist').onclick=e=>{const el=e.target.closest('.pit');if(!el)return;
  const it=PALS[+el.dataset.pi];if(it){closePal();it.run()}};
 $('#plist').onmousemove=e=>{const el=e.target.closest('.pit');if(!el)return;
  const i2=+el.dataset.pi;if(i2!==PALI){PALI=i2;hiPal()}};
 document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();
   $('#pal').classList.contains('hide')?openPal():closePal();return}
  if(e.key==='Escape'){
   if(!$('#pal').classList.contains('hide')){closePal();return}
   if(!$('#dr').classList.contains('hide')){closeDr();return}
   if(!$('#fp').classList.contains('hide'))$('#fp').classList.add('hide');return}
  if(e.key==='/'&&!/(INPUT|TEXTAREA|SELECT)/.test((document.activeElement||{}).tagName||'')&&!$('#qw').classList.contains('hide')){e.preventDefault();$('#q').focus()}});
 window.addEventListener('online',()=>$('#offb').classList.add('hide'));
 window.addEventListener('offline',()=>$('#offb').classList.remove('hide'));
 if(!navigator.onLine)$('#offb').classList.remove('hide')}

/* ───────── запуск ───────── */
bind();
restartAuto();
if(!FIRE_OK){
 const sp=$('#splash');sp.querySelector('.logo').classList.add('hide');
 sp.querySelector('.smsg').textContent='Не удалось загрузить Firebase. Проверьте интернет-соединение и обновите страницу.'}
else{
 auth.onAuthStateChanged(u=>{
  if(u){$('#splash').classList.add('hide');load()}
  else showLogin()})}
</script>
</body>
</html>
